id: 79
name: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')
abstraction: BASE
structure: SIMPLE
status: STABLE
description: >-
  The product does not neutralize or incorrectly neutralizes user-controllable input before it is placed
  in output that is used as a web page that is served to other users.
related_weaknesses:
- nature: CHILD_OF
  cwe_id: 74
  view_id: 1000
  ordinal: PRIMARY
- nature: CHILD_OF
  cwe_id: 116
  view_id: 1000
weakness_ordinalities:
- ordinality: PRIMARY
  description: This weakness is considered primary when it leads directly to an exploitable vulnerability.
applicable_platforms:
  languages:
  - prevalence: SOMETIMES
    name: PHP
  - prevalence: SOMETIMES
    name: JAVASCRIPT
  - prevalence: UNDETERMINED
    class_: NOT_LANGUAGE_SPECIFIC
  technologies:
  - prevalence: SOMETIMES
    class_: WEB_BASED
modes_of_introduction:
- phase: IMPLEMENTATION
  note: This weakness is introduced when the developer uses untrusted data in generated HTML output.
- phase: ARCHITECTURE_AND_DESIGN
  note: If a framework is chosen that does not provide automatic output encoding, XSS can be harder to prevent.
alternate_terms:
- term: XSS
  description: The common abbreviation for Cross-Site Scripting.
- term: HTML Injection
likelihood_of_exploit: HIGH
common_consequences:
- scopes:
  - CONFIDENTIALITY
  - INTEGRITY
  impacts:
  - READ_APPLICATION_DATA
  - EXECUTE_UNAUTHORIZED_CODE_OR_COMMANDS
  note: The attacker can read session cookies and execute arbitrary scripts in the victim's browser context.
detection_methods:
- detection_method_id: DM-2
  method: AUTOMATED_STATIC_ANALYSIS
  description: >-
    SAST tools can detect data flows from user input to HTML output sinks.
  effectiveness: MODERATE
potential_mitigations:
- phases:
  - IMPLEMENTATION
  strategy: OUTPUT_ENCODING
  description: Use context-sensitive output encoding/escaping for all user-supplied data.
  effectiveness: HIGH
- phases:
  - ARCHITECTURE_AND_DESIGN
  strategy: LIBRARIES_OR_FRAMEWORKS
  description: Use a vetted library or framework with automatic output encoding built in.
  effectiveness: HIGH
observed_examples:
- reference: CVE-2002-1700
  description: >-
    Product does not encode HTML markup in user-supplied error messages; allows XSS.
  link: https://www.cve.org/CVERecord?id=CVE-2002-1700
taxonomy_mappings:
- taxonomy_name: OWASP_TOP_TEN
  entry_id: A7
  entry_name: Cross-Site Scripting (XSS)
  mapping_fit: EXACT
references:
- external_reference_id: REF-44
  section: "Chapter 2: The Root Causes of Software Insecurity"
- external_reference_id: REF-62
mapping_notes:
  usage: ALLOWED
  rationale: >-
    This entry is at the Base level, which is a preferred level of abstraction for mapping.
  comments: >-
    Map to this entry when the vulnerability involves direct HTML output of unvalidated data.
  reasons:
  - ACCEPTABLE_USE
content_history:
