Detection_Methods:
  - Detection_Method_ID: DM-14
    Method: Automated Static Analysis
    Description: Automated static analysis, commonly referred to as Static Application Security
      Testing (SAST), can find some instances of this weakness by analyzing source code (or
      binary/compiled code) without having to execute it. Typically, this is done by building
      a model of data flow and control flow, then searching for potentially-vulnerable patterns
      that connect "sources" (origins of input) with "sinks" (destinations where the data
      interacts with external components, a lower layer such as the OS, etc.)
    Effectiveness: High
  - Detection_Method_ID: DM-15
    Method: Automated Dynamic Analysis
    Description: "Use tools that are integrated during\n\t     compilation to insert runtime\
      \ error-checking mechanisms\n\t     related to memory safety errors, such as AddressSanitizer\n\
      \t     (ASan) for C/C++ [REF-1518]."
    Effectiveness: Moderate
    Effectiveness_Notes: "Crafted inputs are necessary to\n\t     reach the code containing\
      \ the error, such as generated\n\t     by fuzzers.  Also, these tools may reduce performance,\n\
      \t     and they only report the error condition - not the\n\t     original mistake that\
      \ led to the\n\t     error."
Demonstrative_Examples:
  - Demonstrative_Example_ID: DX-33
    Intro_Text: The following image processing code allocates a table for images.
    Entries:
      - Example_Code:
          Nature: Bad
          Language: C
          Value: <div>img_t table_ptr; /*struct containing img data, 10kB each*/<br/>int num_imgs;<br/>...<br/>num_imgs
            = get_num_imgs();<br/>table_ptr = (img_t*)malloc(sizeof(img_t)*num_imgs);<br/>...</div>
      - Body_Text: This code intends to allocate a table of size num_imgs, however as num_imgs
          grows large, the calculation determining the size of the list will eventually overflow
          (CWE-190). This will result in a very small list to be allocated instead. If the
          subsequent code operates on the list as if it were num_imgs long, it may result
          in many types of out-of-bounds problems (CWE-119).
Observed_Examples:
  - Reference: CVE-2021-43537
    Description: 'Chain: in a web browser, an unsigned 64-bit integer is forcibly cast to
      a 32-bit integer (CWE-681) and potentially leading to an integer overflow (CWE-190).
      If an integer overflow occurs, this can cause heap memory corruption (CWE-122)'
    Link: https://www.cve.org/CVERecord?id=CVE-2021-43537
  - Reference: CVE-2017-1000121
    Description: 'Chain: unchecked message size metadata allows integer overflow (CWE-190)
      leading to buffer overflow (CWE-119).'
    Link: https://www.cve.org/CVERecord?id=CVE-2017-1000121
