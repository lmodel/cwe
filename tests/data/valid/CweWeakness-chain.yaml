ID: '680'
Name: Integer Overflow to Buffer Overflow
Abstraction: Compound
Structure: Chain
Status: Draft
Description: The product performs a calculation to determine how much memory to allocate,
  but an integer overflow can occur that causes less memory to be allocated than expected,
  leading to a buffer overflow.
