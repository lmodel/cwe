ID: '1305'
Name: CISQ Quality Measures (2020)
Type: Graph
Status: Incomplete
Objective: This view outlines the most important software quality issues as identified by
  the Consortium for Information &amp; Software Quality (CISQ) Automated Quality Characteristic
  Measures, released in 2020. These measures are derived from Object Management Group (OMG)
  standards.
Audience:
  - Type: Software Developers
    Description: This view provides a good starting point for anyone involved in software
      development (including architects, designers, coders, and testers) to ensure that code
      quality issues are considered during the development process.
  - Type: Product Vendors
    Description: This view can help product vendors understand code quality issues and convey
      an overall status of their software.
  - Type: Assessment Tool Vendors
    Description: This view provides a good starting point for assessment tool vendors (e.g.,
      vendors selling static analysis tools) who wish to understand what constitutes software
      with good code quality, and which quality issues may be of concern.
