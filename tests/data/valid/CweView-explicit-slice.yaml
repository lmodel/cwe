ID: '1343'
Name: Weaknesses in the 2021 CWE Most Important Hardware Weaknesses List
Type: Explicit
Status: Stable
Objective: CWE entries in this view are listed in the 2021 CWE Most Important Hardware Weaknesses
  List, as determined by the Hardware CWE Special Interest Group (HW CWE SIG).
Audience:
  - Type: Hardware Designers
    Description: By following this list, hardware designers and implementers are able to significantly
      reduce the number of weaknesses that occur in their products.
  - Type: Product Customers
    Description: Customers can use the weaknesses in this view in order to formulate independent
      evidence of a claim by a product vendor to have eliminated / mitigated the most dangerous
      weaknesses.
  - Type: Educators
    Description: Educators can use this view to focus curriculum on the most important hardware
      weaknesses.
