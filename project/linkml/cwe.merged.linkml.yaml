        }
      },
      "description": "How one weakness relates to another.",
      "comments": [
        "ChildOf and ParentOf are inverses, as are CanPrecede and CanFollow, and Requires and RequiredBy. PeerOf and Overlaps read the same in both directions, as the CWE news article of 2026-10-28 says. The XSD says CanAlsoBe need not be reciprocal."
