          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweDemonstrativeExample",
          "domain_of": [
            "CweDemonstrativeExample"
          ],
          "range": "cwe_structured_text",
          "required": true
        },
        "Entries": {
          "name": "Entries",
          "description": "The example's prose and code, in the order they are meant to be read.",
          "comments": [
            "The XSD gives this list no name, because it writes a repeating choice of two elements. The name is the one the CWE REST API uses, and it is the one key here that is not in the XSD."
          ],
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweDemonstrativeExample",
          "domain_of": [
            "CweDemonstrativeExample"
          ],
          "range": "CweExampleEntry",
          "multivalued": true,
          "inlined": true,
          "inlined_as_list": true
        }
      }
    },
    "CweExampleEntry": {
      "name": "CweExampleEntry",
      "annotations": {
        "xsd_type": {
          "tag": "xsd_type",
          "value": "DemonstrativeExamplesType/Demonstrative_Example#choice"
        }
      },
      "description": "One step of a worked example, either some prose or some code.",
      "from_schema": "https://w3id.org/lmodel/cwe",
      "attributes": {
        "Body_Text": {
          "name": "Body_Text",
          "description": "Prose that explains the code around it.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweExampleEntry",
          "domain_of": [
            "CweExampleEntry"
          ],
          "range": "cwe_structured_text"
        },
        "Example_Code": {
          "name": "Example_Code",
          "description": "A block of code.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweExampleEntry",
          "domain_of": [
            "CweExampleEntry"
          ],
          "range": "CweExampleCode",
          "inlined": true
        }
      },
      "exactly_one_of": [
        {
          "slot_conditions": {
            "Body_Text": {
              "name": "Body_Text",
              "required": true
            }
          }
        },
        {
          "slot_conditions": {
            "Example_Code": {
              "name": "Example_Code",
              "required": true
            }
          }
        }
      ]
    },
    "CweExampleCode": {
      "name": "CweExampleCode",
      "annotations": {
        "xsd_type": {
          "tag": "xsd_type",
          "value": "StructuredCodeType"
        }
      },
      "description": "A block of code in a worked example.",
      "from_schema": "https://w3id.org/lmodel/cwe",
      "attributes": {
        "Nature": {
          "name": "Nature",
          "description": "What the code shows.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweExampleCode",
          "domain_of": [
            "CweRelatedWeakness",
            "CweExampleCode"
          ],
          "range": "CweCodeNature",
          "required": true
        },
        "Language": {
          "name": "Language",
          "description": "The language of the code.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweExampleCode",
          "domain_of": [
            "CweApplicablePlatforms",
            "CweExampleCode"
          ],
          "range": "CweLanguageName"
        },
        "Value": {
          "name": "Value",
          "annotations": {
            "xsd_text_of": {
              "tag": "xsd_text_of",
              "value": "StructuredTextType"
            }
          },
          "description": "The code, as an XHTML fragment with its special characters escaped.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweExampleCode",
          "domain_of": [
            "CweDimension",
            "CweCustomPhase",
            "CweNote",
            "CwePreviousEntryName",
            "CweExampleCode"
          ],
          "range": "cwe_structured_text"
        }
      }
    },
    "CweObservedExample": {
      "name": "CweObservedExample",
      "annotations": {
        "xsd_type": {
          "tag": "xsd_type",
          "value": "ObservedExampleType/Observed_Example"
        }
      },
      "description": "A real case of a weakness, usually a CVE record.",
      "from_schema": "https://w3id.org/lmodel/cwe",
      "attributes": {
        "Reference": {
          "name": "Reference",
          "description": "The identifier of the case, such as a CVE identifier.",
          "comments": [
            "In CWE 5.0 it holds a CVE identifier in 3173 of 3183 cases and an external reference such as [REF-1100] in the rest, so lmodel/cve's cveId is only related."
          ],
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "related_mappings": [
            "cve:cveId"
          ],
          "owner": "CweObservedExample",
          "domain_of": [
            "CweObservedExample"
          ],
          "range": "string",
          "required": true
        },
        "Description": {
          "name": "Description",
          "description": "What went wrong in that case, as it bears on the weakness.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweObservedExample",
          "domain_of": [
            "CweWeakness",
            "CweWeaknessOrdinality",
            "CweAlternateTerm",
            "CweDetectionMethod",
            "CweMitigation",
            "CweObservedExample",
            "CweStakeholder"
          ],
          "range": "cwe_structured_text",
          "required": true
        },
        "Link": {
          "name": "Link",
          "description": "An address with more about the case.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweObservedExample",
          "domain_of": [
            "CweObservedExample"
          ],
          "range": "uri",
          "required": true
        },
        "Rationale": {
          "name": "Rationale",
          "description": "A hint at why this case was chosen.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweObservedExample",
          "domain_of": [
            "CweExternalReference",
            "CweObservedExample",
            "CweMappingNotes"
          ],
          "range": "CweObservedExampleRationale",
          "multivalued": true
        }
      }
    },
    "CweRelatedAttackPattern": {
      "name": "CweRelatedAttackPattern",
      "annotations": {
        "xsd_type": {
          "tag": "xsd_type",
          "value": "RelatedAttackPatternsType/Related_Attack_Pattern"
        }
      },
      "description": "A pointer from a weakness to an attack pattern in the CAPEC list.",
      "comments": [
        "CAPEC holds the same link from its own side. CWE 5.0 and CAPEC 3.9 each name the same 1212 pairs, which tests/test_catalogue.py holds, so the two classes are the two ends of one link and the mapping is related."
      ],
      "from_schema": "https://w3id.org/lmodel/cwe",
      "related_mappings": [
        "capec:CapecRelatedWeakness"
      ],
      "attributes": {
        "CAPEC_ID": {
          "name": "CAPEC_ID",
          "description": "The number of the attack pattern in the CAPEC list.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "related_mappings": [
            "capec:CapecAttackPattern"
          ],
          "owner": "CweRelatedAttackPattern",
          "domain_of": [
            "CweRelatedAttackPattern"
          ],
          "range": "cwe_capec_id",
          "required": true
        }
      }
    },
    "CweStakeholder": {
      "name": "CweStakeholder",
      "annotations": {
        "xsd_type": {
          "tag": "xsd_type",
          "value": "AudienceType/Stakeholder"
        }
      },
      "description": "A group of people who may find a view useful.",
      "from_schema": "https://w3id.org/lmodel/cwe",
      "attributes": {
        "Type": {
          "name": "Type",
          "description": "The group.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweStakeholder",
          "domain_of": [
            "CweDimension",
            "CweNote",
            "CweContribution",
            "CweView",
            "CweStakeholder",
            "CweMappingReason"
          ],
          "range": "CweStakeholderType",
          "required": true
        },
        "Description": {
          "name": "Description",
          "description": "What in the view this group may find useful.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweStakeholder",
          "domain_of": [
            "CweWeakness",
            "CweWeaknessOrdinality",
            "CweAlternateTerm",
            "CweDetectionMethod",
            "CweMitigation",
            "CweObservedExample",
            "CweStakeholder"
          ],
          "range": "string"
        }
      }
    },
    "CweMember": {
      "name": "CweMember",
      "annotations": {
        "xsd_type": {
          "tag": "xsd_type",
          "value": "MemberType"
        }
      },
      "description": "A link from a grouping or a view to an entry it holds or belongs to, in one view.",
      "from_schema": "https://w3id.org/lmodel/cwe",
      "attributes": {
        "CWE_ID": {
          "name": "CWE_ID",
          "description": "The entry at the other end of the link.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweMember",
          "domain_of": [
            "CweRelatedWeakness",
            "CweMember",
            "CweMappingSuggestion"
          ],
          "range": "CweEntry",
          "required": true,
          "pattern": "^[1-9][0-9]*$"
        },
        "View_ID": {
          "name": "View_ID",
          "description": "The view in which the link holds.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweMember",
          "domain_of": [
            "CweRelatedWeakness",
            "CweMember"
          ],
          "range": "CweView",
          "required": true,
          "pattern": "^[1-9][0-9]*$"
        },
        "Dimensions": {
          "name": "Dimensions",
          "description": "The aspects in which the two entries differ.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweMember",
          "domain_of": [
            "CweWeakness",
            "CweRelatedWeakness",
            "CweMember"
          ],
          "range": "CweDimension",
          "multivalued": true,
          "inlined": true,
          "inlined_as_list": true
        }
      }
    },
    "CweRelationships": {
      "name": "CweRelationships",
      "annotations": {
        "xsd_type": {
          "tag": "xsd_type",
          "value": "RelationshipsType"
        }
      },
      "description": "The entries that a grouping or a view holds or belongs to.",
      "from_schema": "https://w3id.org/lmodel/cwe",
      "attributes": {
        "Member_Of": {
          "name": "Member_Of",
          "description": "An entry that holds this one.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweRelationships",
          "domain_of": [
            "CweRelationships"
          ],
          "range": "CweMember",
          "multivalued": true,
          "inlined": true,
          "inlined_as_list": true
        },
        "Has_Member": {
          "name": "Has_Member",
          "description": "An entry that this one holds.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweRelationships",
          "domain_of": [
            "CweRelationships"
          ],
          "range": "CweMember",
          "multivalued": true,
          "inlined": true,
          "inlined_as_list": true
        }
      },
      "any_of": [
        {
          "slot_conditions": {
            "Member_Of": {
              "name": "Member_Of",
              "required": true
            }
          }
        },
        {
          "slot_conditions": {
            "Has_Member": {
              "name": "Has_Member",
              "required": true
            }
          }
        }
      ]
    },
    "CweMappingNotes": {
      "name": "CweMappingNotes",
      "annotations": {
        "xsd_type": {
          "tag": "xsd_type",
          "value": "MappingNotesType"
        }
      },
      "description": "Guidance on whether to map a real vulnerability to an entry, and on what to use instead.",
      "from_schema": "https://w3id.org/lmodel/cwe",
      "attributes": {
        "Usage": {
          "name": "Usage",
          "description": "Whether the entry may be used for mapping.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "exact_mappings": [
            "sepses_cwe:mappingUsage"
          ],
          "owner": "CweMappingNotes",
          "domain_of": [
            "CweMappingNotes"
          ],
          "range": "CweUsage",
          "required": true
        },
        "Rationale": {
          "name": "Rationale",
          "description": "Why the entry has that usage.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweMappingNotes",
          "domain_of": [
            "CweExternalReference",
            "CweObservedExample",
            "CweMappingNotes"
          ],
          "range": "cwe_structured_text",
          "required": true
        },
        "Comments": {
          "name": "Comments",
          "description": "More advice for someone mapping to the entry.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweMappingNotes",
          "domain_of": [
            "CweMappingNotes"
          ],
          "range": "cwe_structured_text",
          "required": true
        },
        "Reasons": {
          "name": "Reasons",
          "description": "Short labels that sum up the usage.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweMappingNotes",
          "domain_of": [
            "CweMappingNotes"
          ],
          "range": "CweMappingReason",
          "required": true,
          "multivalued": true,
          "inlined": true,
          "inlined_as_list": true
        },
        "Suggestions": {
          "name": "Suggestions",
          "description": "Other weaknesses that may suit the mapping better.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweMappingNotes",
          "domain_of": [
            "CweMappingNotes"
          ],
          "range": "CweMappingSuggestion",
          "multivalued": true,
          "inlined": true,
          "inlined_as_list": true
        }
      }
    },
    "CweMappingReason": {
      "name": "CweMappingReason",
      "annotations": {
        "xsd_type": {
          "tag": "xsd_type",
          "value": "ReasonsType/Reason"
        }
      },
      "description": "One short label that sums up the usage of an entry.",
      "from_schema": "https://w3id.org/lmodel/cwe",
      "attributes": {
        "Type": {
          "name": "Type",
          "description": "The label.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweMappingReason",
          "domain_of": [
            "CweDimension",
            "CweNote",
            "CweContribution",
            "CweView",
            "CweStakeholder",
            "CweMappingReason"
          ],
          "range": "CweReason",
          "required": true
        }
      }
    },
    "CweMappingSuggestion": {
      "name": "CweMappingSuggestion",
      "annotations": {
        "xsd_type": {
          "tag": "xsd_type",
          "value": "SuggestionsType/Suggestion"
        }
      },
      "description": "A weakness that may suit a mapping better than this entry.",
      "from_schema": "https://w3id.org/lmodel/cwe",
      "attributes": {
        "CWE_ID": {
          "name": "CWE_ID",
          "description": "The suggested weakness.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweMappingSuggestion",
          "domain_of": [
            "CweRelatedWeakness",
            "CweMember",
            "CweMappingSuggestion"
          ],
          "range": "CweWeakness",
          "required": true,
          "pattern": "^[1-9][0-9]*$"
        },
        "Comment": {
          "name": "Comment",
          "description": "When the suggestion applies.",
          "from_schema": "https://w3id.org/lmodel/cwe/cwe_entries",
          "owner": "CweMappingSuggestion",
          "domain_of": [
            "CweMappingSuggestion"
          ],
          "range": "string",
          "required": true
        }
      }
    }
  },
  "metamodel_version": "1.12.0",
  "source_file": "src/cwe/schema/cwe.yaml",
  "@type": "SchemaDefinition"
}