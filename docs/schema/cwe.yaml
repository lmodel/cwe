  WeaknessCatalog:
    name: WeaknessCatalog
    definition_uri: https://w3id.org/lmodel/cwe/WeaknessCatalog
    description: Top-level container for a CWE catalog snapshot (Weakness_Catalog
      in XSD). Holds weakness entries, categories, views, external references, and
      NVD weakness observations.
    in_subset:
    - cwe_dictionary
    from_schema: https://w3id.org/lmodel/cwe
    see_also:
    - https://cwe.mitre.org/data/downloads.html
    slots:
    - WeaknessCatalog_name
    - WeaknessCatalog_version
    - WeaknessCatalog_date
    - weaknesses
    - categories
    - views
    - external_references
    - observations
    slot_usage:
      name:
        name: name
        identifier: true
        required: true
      version:
        name: version
        required: true
      date:
        name: date
        required: true
    class_uri: cwe:WeaknessCatalog
    tree_root: true
  Weakness:
    name: Weakness
    definition_uri: https://w3id.org/lmodel/cwe/Weakness
