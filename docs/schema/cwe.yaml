classes:
  CweWeaknessCatalog:
    name: CweWeaknessCatalog
    definition_uri: https://w3id.org/lmodel/cwe/CweWeaknessCatalog
    annotations:
      xsd_type:
        tag: xsd_type
        value: Weakness_Catalog
    description: One release of the CWE List, with all its entries and the sources
      they cite.
    comments:
    - Wikidata's item is the catalogue in general and this class is one release of
      it, so the item is related.
    from_schema: https://w3id.org/lmodel/cwe
    close_mappings:
    - skos:ConceptScheme
    - schema:DefinedTermSet
    related_mappings:
    - wd:Q2682392
    slots:
    - cweWeaknessCatalog__Name
    - cweWeaknessCatalog__Version
    - cweWeaknessCatalog__Date
    - cweWeaknessCatalog__Weaknesses
    - cweWeaknessCatalog__Groupings
    - cweWeaknessCatalog__Views
    - cweWeaknessCatalog__External_References
    attributes:
      Name:
        name: Name
        description: The name of the catalogue, which is CWE.
        required: true
      Version:
        name: Version
        description: The version of this release.
        required: true
      Date:
        name: Date
        description: The date of this release.
        range: date
        required: true
      Weaknesses:
        name: Weaknesses
        description: The weakness entries.
        range: CweWeakness
        multivalued: true
        inlined: true
        inlined_as_list: true
      Groupings:
        name: Groupings
        description: The grouping entries.
        range: CweGrouping
        multivalued: true
        inlined: true
        inlined_as_list: true
      Views:
        name: Views
        description: The view entries.
        range: CweView
        multivalued: true
        inlined: true
        inlined_as_list: true
      External_References:
        name: External_References
        description: The sources that the entries cite.
        range: CweExternalReference
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: cwe:CweWeaknessCatalog
    tree_root: true
  CweExternalReference:
    name: CweExternalReference
    definition_uri: https://w3id.org/lmodel/cwe/CweExternalReference
    annotations:
      xsd_type:
        tag: xsd_type
        value: ExternalReferenceType
    description: A source that entries of the catalogue cite, such as a paper, a book
      or a web page.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    close_mappings:
    - sepses_cwe:Reference
    slots:
    - cweExternalReference__Reference_ID
    - cweExternalReference__Author
    - cweExternalReference__Title
    - cweExternalReference__Edition
    - cweExternalReference__Publication
    - cweExternalReference__Publication_Year
    - cweExternalReference__Publication_Month
    - cweExternalReference__Publication_Day
    - cweExternalReference__Publisher
    - cweExternalReference__URL
    - cweExternalReference__URL_Date
    - cweExternalReference__Alt_URL
    - cweExternalReference__Alt_URL_Date
    - cweExternalReference__Media_Type
    - cweExternalReference__Access_Restrictions
    - cweExternalReference__Rationale
    attributes:
      Reference_ID:
        name: Reference_ID
        description: The identifier entries use to cite this source.
        identifier: true
        range: cwe_reference_id
      Author:
        name: Author
        description: A person or group who wrote the source.
        exact_mappings:
        - sepses_cwe:referenceAuthor
        close_mappings:
        - dcterms:creator
        multivalued: true
      Title:
        name: Title
        description: The title of the source.
        exact_mappings:
        - sepses_cwe:referenceTitle
        - dcterms:title
        required: true
      Edition:
        name: Edition
        description: The edition of the source.
        exact_mappings:
        - sepses_cwe:referenceEdition
        close_mappings:
        - schema:bookEdition
      Publication:
        name: Publication
        description: The journal, conference or other publication that holds the source.
      Publication_Year:
        name: Publication_Year
        description: The year the source came out.
        exact_mappings:
        - sepses_cwe:referencePublicationYear
        range: cwe_publication_year
      Publication_Month:
        name: Publication_Month
        description: The month the source came out.
        exact_mappings:
        - sepses_cwe:referencePublicationMonth
        range: cwe_publication_month
      Publication_Day:
        name: Publication_Day
        description: The day of the month the source came out.
        exact_mappings:
        - sepses_cwe:referencePublicationDay
        range: cwe_publication_day
      Publisher:
        name: Publisher
        description: Who published the source.
        exact_mappings:
        - sepses_cwe:referencePublisher
        close_mappings:
        - dcterms:publisher
      URL:
        name: URL
        description: An address where the source can be read.
        comments:
        - One entry of CWE 5.0, REF-1068, holds the word Original here, which the
          XSD's anyURI admits.
        exact_mappings:
        - sepses_cwe:referenceUrl
        close_mappings:
        - schema:url
        range: uri
      URL_Date:
        name: URL_Date
        description: The date on which the address was last seen to work.
        range: date
      Alt_URL:
        name: Alt_URL
        description: Another address of the source, usually one with fewer restrictions.
        range: uri
      Alt_URL_Date:
        name: Alt_URL_Date
        description: The date on which the other address was last seen to work.
        range: date
      Media_Type:
        name: Media_Type
        description: A form the source takes.
        range: CweReferenceMediaType
        multivalued: true
      Access_Restrictions:
        name: Access_Restrictions
        description: What stands between a reader and the source.
        range: CweReferenceAccessRestriction
      Rationale:
        name: Rationale
        description: A hint at why the source was cited.
        range: CweReferenceRationale
        multivalued: true
    class_uri: cwe:CweExternalReference
  CweReference:
    name: CweReference
    definition_uri: https://w3id.org/lmodel/cwe/CweReference
    annotations:
      xsd_type:
        tag: xsd_type
        value: ReferencesType/Reference
    description: A citation of an external reference from an entry or from one of
      its parts.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    slots:
    - cweReference__External_Reference_ID
    - cweReference__Section
    attributes:
      External_Reference_ID:
        name: External_Reference_ID
        description: The external reference being cited.
        range: CweExternalReference
        required: true
      Section:
        name: Section
        description: The section or page of the source that this citation means.
    class_uri: cwe:CweReference
  CweDimension:
    name: CweDimension
    definition_uri: https://w3id.org/lmodel/cwe/CweDimension
    annotations:
      xsd_type:
        tag: xsd_type
        value: DimensionElementType
    description: One aspect of a weakness, or of how two weaknesses differ, named
      in a word or two.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    slots:
    - cweDimension__Type
    - cweDimension__Value
    attributes:
      Type:
        name: Type
        description: The kind of aspect, such as a behaviour or a resource.
        range: CweDimensionType
        required: true
      Value:
        name: Value
        annotations:
          xsd_text_of:
            tag: xsd_text_of
            value: xs:string
        description: The aspect itself, such as Generation or Page.
        required: true
    class_uri: cwe:CweDimension
  CweCustomPhase:
    name: CweCustomPhase
    definition_uri: https://w3id.org/lmodel/cwe/CweCustomPhase
    annotations:
      xsd_type:
        tag: xsd_type
        value: CustomPhaseType
    description: A life cycle stage from a field whose stages differ from those of
      software.
    comments:
    - XML Schema cannot tie the value to the domain, as a comment in the XSD regrets,
      so the XSD takes either list under either domain. The rules below state what
      it means, and tests/test_schema_rules.py holds their lists to the two enums.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    slots:
    - cweCustomPhase__Domain
    - cweCustomPhase__Value
    attributes:
      Domain:
        name: Domain
        description: The field whose life cycle the stage belongs to.
        range: CweCustomPhaseDomain
        required: true
      Value:
        name: Value
        annotations:
          xsd_text_of:
            tag: xsd_text_of
            value: CustomPhaseEnumeration
        description: The stage.
        required: true
        any_of:
        - range: CweAiPhase
        - range: CweHardwarePhase
    class_uri: cwe:CweCustomPhase
    rules:
    - preconditions:
        slot_conditions:
          Domain:
            name: Domain
            equals_string: AI
      postconditions:
        slot_conditions:
          Value:
            name: Value
            equals_string_in:
            - Data Collection
            - Training
            - Fine-tuning
            - Testing
            - Tokenization
            - Prompting
            - Output Processing
            - Component Interaction
            - Re-training / Feedback
      description: A stage in the AI domain comes from the AI list.
    - preconditions:
        slot_conditions:
          Domain:
            name: Domain
            equals_string: Hardware
      postconditions:
        slot_conditions:
          Value:
            name: Value
            equals_string_in:
            - Hardware Requirements
            - Hardware Architecture
            - Hardware Microarchitecture
            - Implementation & Physical Design
            - Pre-Manufacturing Verification
            - Hardware Manufacturing
            - Post-Manufacturing Validation
            - Device Configuration & Personalization
            - Device / System Integration
            - Field Operations & Sustainment
            - Reuse
            - Decommissioning
      description: A stage in the Hardware domain comes from the hardware list.
  CweNote:
    name: CweNote
    definition_uri: https://w3id.org/lmodel/cwe/CweNote
    annotations:
      xsd_type:
        tag: xsd_type
        value: NotesType/Note
    description: A remark on an entry that fits nowhere else.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    slots:
    - cweNote__Type
    - cweNote__Version
    - cweNote__ReleaseDate
    - cweNote__Value
    attributes:
      Type:
        name: Type
        description: What the note is about.
        range: CweNoteType
        required: true
      Version:
        name: Version
        description: The CWE version the note belongs to.
      ReleaseDate:
        name: ReleaseDate
        description: The release date of that version.
        range: date
      Value:
        name: Value
        annotations:
          xsd_text_of:
            tag: xsd_text_of
            value: StructuredTextType
        description: The text of the note.
        range: cwe_structured_text
    class_uri: cwe:CweNote
  CweTaxonomyMapping:
    name: CweTaxonomyMapping
    definition_uri: https://w3id.org/lmodel/cwe/CweTaxonomyMapping
    annotations:
      xsd_type:
        tag: xsd_type
        value: TaxonomyMappingsType/Taxonomy_Mapping
    description: A link from an entry to an entry of another taxonomy.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    slots:
    - cweTaxonomyMapping__Taxonomy_Name
    - cweTaxonomyMapping__Entry_ID
    - cweTaxonomyMapping__Entry_Name
    - cweTaxonomyMapping__Mapping_Fit
    attributes:
      Taxonomy_Name:
        name: Taxonomy_Name
        description: The other taxonomy.
        range: CweTaxonomyName
        required: true
      Entry_ID:
        name: Entry_ID
        description: The identifier of the entry in the other taxonomy.
      Entry_Name:
        name: Entry_Name
        description: The name of the entry in the other taxonomy.
      Mapping_Fit:
        name: Mapping_Fit
        description: How closely the two entries match.
        range: CweMappingFit
    class_uri: cwe:CweTaxonomyMapping
  CweContentHistory:
    name: CweContentHistory
    definition_uri: https://w3id.org/lmodel/cwe/CweContentHistory
    annotations:
      xsd_type:
        tag: xsd_type
        value: ContentHistoryType
    description: The record of who wrote an entry and how it has changed since.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    slots:
    - cweContentHistory__Submission
    - cweContentHistory__Modification
    - cweContentHistory__Contribution
    - cweContentHistory__Previous_Entry_Name
    attributes:
      Submission:
        name: Submission
        description: The original submission of the entry, or each of several.
        close_mappings:
        - sepses_cwe:hasSubmissionHistory
        range: CweSubmission
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      Modification:
        name: Modification
        description: A change made to the entry.
        close_mappings:
        - sepses_cwe:hasModificationHistory
        - skos:changeNote
        range: CweModification
        multivalued: true
        inlined: true
        inlined_as_list: true
      Contribution:
        name: Contribution
        description: Feedback or content that someone gave to the entry.
        range: CweContribution
        multivalued: true
        inlined: true
        inlined_as_list: true
      Previous_Entry_Name:
        name: Previous_Entry_Name
        description: A name the entry used to have.
        range: CwePreviousEntryName
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: cwe:CweContentHistory
  CweSubmission:
    name: CweSubmission
    definition_uri: https://w3id.org/lmodel/cwe/CweSubmission
    annotations:
      xsd_type:
        tag: xsd_type
        value: ContentHistoryType/Submission
    description: Who first submitted an entry, and when it joined the list.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    close_mappings:
    - sepses_cwe:SubmissionHistory
    slots:
    - cweSubmission__Submission_Name
    - cweSubmission__Submission_Organization
    - cweSubmission__Submission_Date
    - cweSubmission__Submission_Version
    - cweSubmission__Submission_ReleaseDate
    - cweSubmission__Submission_Comment
    attributes:
      Submission_Name:
        name: Submission_Name
        description: A person or group who submitted the entry.
        exact_mappings:
        - sepses_cwe:submissionName
        multivalued: true
      Submission_Organization:
        name: Submission_Organization
        description: The organization the submitter belongs to.
        exact_mappings:
        - sepses_cwe:submissionOrganization
      Submission_Date:
        name: Submission_Date
        description: The date of the submission.
        exact_mappings:
        - sepses_cwe:submissionDate
        range: date
        required: true
      Submission_Version:
        name: Submission_Version
        description: The first CWE version that held the submission.
        required: true
      Submission_ReleaseDate:
        name: Submission_ReleaseDate
        description: The release date of that version.
        range: date
        required: true
      Submission_Comment:
        name: Submission_Comment
        description: A remark on the submission.
    class_uri: cwe:CweSubmission
    any_of:
    - slot_conditions:
        Submission_Name:
          name: Submission_Name
          required: true
    - slot_conditions:
        Submission_Organization:
          name: Submission_Organization
          required: true
  CweModification:
    name: CweModification
    definition_uri: https://w3id.org/lmodel/cwe/CweModification
    annotations:
      xsd_type:
        tag: xsd_type
        value: ContentHistoryType/Modification
    description: One change made to an entry.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    close_mappings:
    - sepses_cwe:ModificationHistory
    slots:
    - cweModification__Modification_Name
    - cweModification__Modification_Organization
    - cweModification__Modification_Date
    - cweModification__Modification_Version
    - cweModification__Modification_ReleaseDate
    - cweModification__Modification_Importance
    - cweModification__Modification_Comment
    attributes:
      Modification_Name:
        name: Modification_Name
        description: The person who made or suggested the change.
        exact_mappings:
        - sepses_cwe:modificationName
      Modification_Organization:
        name: Modification_Organization
        description: The organization that person belongs to.
        exact_mappings:
        - sepses_cwe:modificationOrganization
      Modification_Date:
        name: Modification_Date
        description: The date of the change.
        exact_mappings:
        - sepses_cwe:modificationDate
        range: date
        required: true
      Modification_Version:
        name: Modification_Version
        description: The first CWE version that held the change.
        required: true
      Modification_ReleaseDate:
        name: Modification_ReleaseDate
        description: The release date of that version.
        range: date
        required: true
      Modification_Importance:
        name: Modification_Importance
        description: How much the change matters to people who rely on the entry.
        range: CweImportance
      Modification_Comment:
        name: Modification_Comment
        description: What changed.
        exact_mappings:
        - sepses_cwe:modificationComment
        required: true
    class_uri: cwe:CweModification
  CweContribution:
    name: CweContribution
    definition_uri: https://w3id.org/lmodel/cwe/CweContribution
    annotations:
      xsd_type:
        tag: xsd_type
        value: ContentHistoryType/Contribution
    description: Feedback or content that someone gave to an entry.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    slots:
    - cweContribution__Type
    - cweContribution__Contribution_Name
    - cweContribution__Contribution_Organization
    - cweContribution__Contribution_Date
    - cweContribution__Contribution_Version
    - cweContribution__Contribution_ReleaseDate
    - cweContribution__Contribution_Comment
    attributes:
      Type:
        name: Type
        description: Whether the contribution was feedback or content.
        range: CweContributionType
        required: true
      Contribution_Name:
        name: Contribution_Name
        description: A person or group who contributed.
        multivalued: true
      Contribution_Organization:
        name: Contribution_Organization
        description: The organization the contributor belongs to.
      Contribution_Date:
        name: Contribution_Date
        description: The date of the contribution.
        range: date
        required: true
      Contribution_Version:
        name: Contribution_Version
        description: The first CWE version that held the contribution.
        required: true
      Contribution_ReleaseDate:
        name: Contribution_ReleaseDate
        description: The release date of that version.
        range: date
        required: true
      Contribution_Comment:
        name: Contribution_Comment
        description: A remark on the contribution.
    class_uri: cwe:CweContribution
  CwePreviousEntryName:
    name: CwePreviousEntryName
    definition_uri: https://w3id.org/lmodel/cwe/CwePreviousEntryName
    annotations:
      xsd_type:
        tag: xsd_type
        value: ContentHistoryType/Previous_Entry_Name
    description: A name an entry had before.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    slots:
    - cwePreviousEntryName__Date
    - cwePreviousEntryName__Version
    - cwePreviousEntryName__Value
    attributes:
      Date:
        name: Date
        description: The date the name stopped being used.
        range: date
        required: true
      Version:
        name: Version
        description: The CWE version in which the name changed.
      Value:
        name: Value
        annotations:
          xsd_text_of:
            tag: xsd_text_of
            value: xs:string
        description: The earlier name.
        required: true
    class_uri: cwe:CwePreviousEntryName
  CweEntry:
    name: CweEntry
    definition_uri: https://w3id.org/lmodel/cwe/CweEntry
    annotations:
      xsd_type:
        tag: xsd_type
        value: WeaknessType GroupingType ViewType
    description: 'Any item of the CWE List that has an identifier of its own: a weakness,
      a grouping or a view.'
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    see_also:
    - https://cwe.mitre.org/documents/glossary/index.html#Entry
    abstract: true
    slots:
    - cweEntry__ID
    - cweEntry__Name
    - cweEntry__Status
    - cweEntry__References
    - cweEntry__Mapping_Notes
    - cweEntry__Notes
    - cweEntry__Content_History
    attributes:
      ID:
        name: ID
        description: The number that identifies the entry across the whole list.
        comments:
        - Wikidata's P3624 holds this number for a weakness, without the CWE- prefix.
          lmodel/cve's cweId and lmodel/kev-catalog's cwes write the same number with
          the prefix, as CWE-79, so they are related.
        close_mappings:
        - wdt:P3624
        - schema:termCode
        related_mappings:
        - cve:cweId
        - kev_catalog:cwes
        identifier: true
        range: cwe_entry_id
      Name:
        name: Name
        description: The name of the entry.
        close_mappings:
        - schema:name
        - skos:prefLabel
        required: true
      Status:
        name: Status
        description: How far the entry has come and how much it can be trusted.
        exact_mappings:
        - sepses_cwe:status
        range: CweStatus
        required: true
      References:
        name: References
        description: The external references the entry cites.
        close_mappings:
        - sepses_cwe:hasReference
        range: CweReference
        multivalued: true
        inlined: true
        inlined_as_list: true
      Mapping_Notes:
        name: Mapping_Notes
        description: Guidance on whether to map a real vulnerability to this entry.
        range: CweMappingNotes
        required: true
        inlined: true
      Notes:
        name: Notes
        description: Remarks on the entry that fit nowhere else.
        close_mappings:
        - skos:note
        range: CweNote
        multivalued: true
        inlined: true
        inlined_as_list: true
      Content_History:
        name: Content_History
        description: Who wrote the entry and how it has changed since.
        range: CweContentHistory
        required: true
        inlined: true
    class_uri: cwe:CweEntry
  CweWeakness:
    name: CweWeakness
    definition_uri: https://w3id.org/lmodel/cwe/CweWeakness
    annotations:
      xsd_type:
        tag: xsd_type
        value: WeaknessType
    description: A type of mistake or condition in software, firmware, hardware or
      a service that can leave a product open to attack.
    comments:
    - The SPDX external reference type names a weakness as a target of a link, and
      an NVD weakness names one as the cause of a vulnerability, so both are related.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    see_also:
    - https://cwe.mitre.org/documents/glossary/index.html#Weakness
    close_mappings:
    - sepses_cwe:CWE
    - schema:DefinedTerm
    - skos:Concept
    related_mappings:
    - spdx_core:ExternalRefType/cwe
    - nist_nvd:NvdWeakness
    is_a: CweEntry
    slots:
    - cweEntry__ID
    - cweEntry__Name
    - cweEntry__Status
    - cweEntry__References
    - cweEntry__Mapping_Notes
    - cweEntry__Notes
    - cweEntry__Content_History
    - cweWeakness__Abstraction
    - cweWeakness__Structure
    - cweWeakness__Diagram
    - cweWeakness__Description
    - cweWeakness__Extended_Description
    - cweWeakness__Technical_Nuance
    - cweWeakness__Dimensions
    - cweWeakness__Related_Weaknesses
    - cweWeakness__Weakness_Ordinalities
    - cweWeakness__Applicable_Platforms
    - cweWeakness__Background_Details
    - cweWeakness__Alternate_Terms
    - cweWeakness__Modes_Of_Introduction
    - cweWeakness__Exploitation_Factors
    - cweWeakness__Likelihood_Of_Exploit
    - cweWeakness__Common_Consequences
    - cweWeakness__Detection_Methods
    - cweWeakness__Potential_Mitigations
    - cweWeakness__Demonstrative_Examples
    - cweWeakness__Observed_Examples
    - cweWeakness__Functional_Areas
    - cweWeakness__Affected_Resources
    - cweWeakness__Taxonomy_Mappings
    - cweWeakness__Related_Attack_Patterns
    attributes:
      Abstraction:
        name: Abstraction
        description: How far the weakness is described in general terms or tied to
          a specific product.
        exact_mappings:
        - sepses_cwe:abstraction
        range: CweAbstraction
        required: true
      Structure:
        name: Structure
        description: Whether the weakness stands alone or is made up of others.
        exact_mappings:
        - sepses_cwe:structure
        range: CweStructure
        required: true
      Diagram:
        name: Diagram
        description: The path on MITRE's site of a diagram of the weakness.
      Description:
        name: Description
        description: A sentence or two that define the weakness.
        close_mappings:
        - dcterms:description
        - schema:description
        - skos:definition
        required: true
      Extended_Description:
        name: Extended_Description
        description: More about the weakness than its short description gives.
        exact_mappings:
        - sepses_cwe:extendedDescription
        range: cwe_structured_text
      Technical_Nuance:
        name: Technical_Nuance
        description: Finer technical detail that helps tell this weakness from close
          relatives.
        range: cwe_structured_text
      Dimensions:
        name: Dimensions
        description: The aspects of the weakness that this entry centres on.
        range: CweDimension
        multivalued: true
        inlined: true
        inlined_as_list: true
      Related_Weaknesses:
        name: Related_Weaknesses
        description: How this weakness relates to others in the list.
        close_mappings:
        - sepses_cwe:hasRelatedWeakness
        related_mappings:
        - skos:semanticRelation
        range: CweRelatedWeakness
        multivalued: true
        inlined: true
        inlined_as_list: true
      Weakness_Ordinalities:
        name: Weakness_Ordinalities
        description: Whether the weakness tends to be a first cause or the result
          of another.
        range: CweWeaknessOrdinality
        multivalued: true
        inlined: true
        inlined_as_list: true
      Applicable_Platforms:
        name: Applicable_Platforms
        description: The languages, systems, architectures and technologies where
          the weakness can appear.
        close_mappings:
        - sepses_cwe:hasApplicablePlatform
        range: CweApplicablePlatforms
        inlined: true
      Background_Details:
        name: Background_Details
        description: Background that helps a reader but does not describe the weakness
          itself.
        close_mappings:
        - sepses_cwe:backgroundDetail
        range: cwe_structured_text
        multivalued: true
      Alternate_Terms:
        name: Alternate_Terms
        description: Other names people use for the weakness.
        range: CweAlternateTerm
        multivalued: true
        inlined: true
        inlined_as_list: true
      Modes_Of_Introduction:
        name: Modes_Of_Introduction
        description: How and when the weakness can get into a product.
        close_mappings:
        - sepses_cwe:hasModeOfIntroduction
        range: CweIntroduction
        multivalued: true
        inlined: true
        inlined_as_list: true
      Exploitation_Factors:
        name: Exploitation_Factors
        description: Conditions that make exploiting the weakness more likely.
        range: cwe_structured_text
        multivalued: true
      Likelihood_Of_Exploit:
        name: Likelihood_Of_Exploit
        description: How likely it is that the weakness gets exploited.
        exact_mappings:
        - sepses_cwe:likelihoodOfExploit
        range: CweLikelihood
      Common_Consequences:
        name: Common_Consequences
        description: What can follow when the weakness is exploited.
        close_mappings:
        - sepses_cwe:hasCommonConsequence
        range: CweConsequence
        multivalued: true
        inlined: true
        inlined_as_list: true
      Detection_Methods:
        name: Detection_Methods
        description: Ways of finding the weakness, with what each is good for.
        close_mappings:
        - sepses_cwe:hasDetectionMethod
        range: CweDetectionMethod
        multivalued: true
        inlined: true
        inlined_as_list: true
      Potential_Mitigations:
        name: Potential_Mitigations
        description: Ways of preventing the weakness or reducing what it can do.
        close_mappings:
        - sepses_cwe:hasPotentialMitigation
        range: CweMitigation
        multivalued: true
        inlined: true
        inlined_as_list: true
      Demonstrative_Examples:
        name: Demonstrative_Examples
        description: Worked examples of how the weakness looks in code.
        range: CweDemonstrativeExample
        multivalued: true
        inlined: true
        inlined_as_list: true
      Observed_Examples:
        name: Observed_Examples
        description: Real cases of the weakness, usually CVE records.
        range: CweObservedExample
        multivalued: true
        inlined: true
        inlined_as_list: true
      Functional_Areas:
        name: Functional_Areas
        description: The parts of a product where the weakness tends to appear.
        range: CweFunctionalArea
        multivalued: true
      Affected_Resources:
        name: Affected_Resources
        description: The system resources that exploiting the weakness can affect.
        range: CweResource
        multivalued: true
      Taxonomy_Mappings:
        name: Taxonomy_Mappings
        description: Links to entries of other taxonomies.
        range: CweTaxonomyMapping
        multivalued: true
        inlined: true
        inlined_as_list: true
      Related_Attack_Patterns:
        name: Related_Attack_Patterns
        description: Attack patterns that may apply where the weakness is present.
        close_mappings:
        - sepses_cwe:hasCAPEC
        range: CweRelatedAttackPattern
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: cwe:CweWeakness
    rules:
    - preconditions:
        slot_conditions:
          Abstraction:
            name: Abstraction
            equals_string: Compound
      postconditions:
        slot_conditions:
          Structure:
            name: Structure
            none_of:
            - equals_string: Simple
      description: A compound weakness is a chain or a composite.
    - preconditions:
        slot_conditions:
          Structure:
            name: Structure
            equals_string: Chain
      postconditions:
        slot_conditions:
          Abstraction:
            name: Abstraction
            equals_string: Compound
      description: A chain is a compound weakness.
    - preconditions:
        slot_conditions:
          Structure:
            name: Structure
            equals_string: Composite
      postconditions:
        slot_conditions:
          Abstraction:
            name: Abstraction
            equals_string: Compound
      description: A composite is a compound weakness.
  CweGrouping:
    name: CweGrouping
    definition_uri: https://w3id.org/lmodel/cwe/CweGrouping
    annotations:
      xsd_type:
        tag: xsd_type
        value: GroupingType
    description: A set of weaknesses gathered by something they share, for browsing
      and not for mapping real vulnerabilities to. Schema versions before 8.0 called
      it a category.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    close_mappings:
    - skos:Collection
    is_a: CweEntry
    slots:
    - cweEntry__ID
    - cweEntry__Name
    - cweEntry__Status
    - cweEntry__References
    - cweEntry__Mapping_Notes
    - cweEntry__Notes
    - cweEntry__Content_History
    - cweGrouping__Summary
    - cweGrouping__Relationships
    - cweGrouping__Taxonomy_Mappings
    attributes:
      Summary:
        name: Summary
        description: What the grouped weaknesses have in common.
        close_mappings:
        - dcterms:description
        range: cwe_structured_text
        required: true
      Relationships:
        name: Relationships
        description: The entries this grouping holds.
        range: CweRelationships
        inlined: true
      Taxonomy_Mappings:
        name: Taxonomy_Mappings
        description: Links to entries of other taxonomies.
        range: CweTaxonomyMapping
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: cwe:CweGrouping
  CweView:
    name: CweView
    definition_uri: https://w3id.org/lmodel/cwe/CweView
    annotations:
      xsd_type:
        tag: xsd_type
        value: ViewType
    description: A way of looking at the catalogue, as a subset of its entries seen
      from one standpoint.
    comments:
    - A graph view arranges concepts as a scheme does, but a slice is a flat list,
      so the SKOS concept scheme is only related.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    see_also:
    - https://cwe.mitre.org/documents/glossary/index.html#View
    related_mappings:
    - skos:ConceptScheme
    is_a: CweEntry
    slots:
    - cweEntry__ID
    - cweEntry__Name
    - cweEntry__Status
    - cweEntry__References
    - cweEntry__Mapping_Notes
    - cweEntry__Notes
    - cweEntry__Content_History
    - cweView__Type
    - cweView__Objective
    - cweView__Audience
    - cweView__Members
    - cweView__Filter
    attributes:
      Type:
        name: Type
        description: How the view selects and arranges its entries.
        range: CweViewType
        required: true
      Objective:
        name: Objective
        description: What the view is for.
        close_mappings:
        - dcterms:description
        range: cwe_structured_text
        required: true
      Audience:
        name: Audience
        description: The people who may find the view useful, and why.
        range: CweStakeholder
        multivalued: true
        inlined: true
        inlined_as_list: true
      Members:
        name: Members
        description: The entries a view names one by one, when it is not selected
          by a filter.
        range: CweRelationships
        inlined: true
      Filter:
        name: Filter
        description: The XPath expression that selects the entries of an implicit
          slice.
    class_uri: cwe:CweView
  CweRelatedWeakness:
    name: CweRelatedWeakness
    definition_uri: https://w3id.org/lmodel/cwe/CweRelatedWeakness
    annotations:
      xsd_type:
        tag: xsd_type
        value: RelatedWeaknessesType/Related_Weakness
    description: A link from a weakness to another weakness, in one view.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    close_mappings:
    - sepses_cwe:RelatedWeakness
    slots:
    - cweRelatedWeakness__Nature
    - cweRelatedWeakness__CWE_ID
    - cweRelatedWeakness__View_ID
    - cweRelatedWeakness__Chain_ID
    - cweRelatedWeakness__Ordinal
    - cweRelatedWeakness__Dimensions
    attributes:
      Nature:
        name: Nature
        description: How the two weaknesses relate.
        exact_mappings:
        - sepses_cwe:relatedWeaknessNature
        range: CweRelatedNature
        required: true
      CWE_ID:
        name: CWE_ID
        description: The weakness at the other end of the link.
        exact_mappings:
        - sepses_cwe:relatedCWE
        range: CweWeakness
        required: true
        pattern: ^[1-9][0-9]*$
      View_ID:
        name: View_ID
        description: The view in which the link holds.
        exact_mappings:
        - sepses_cwe:relatedWeaknessViewId
        range: CweView
        required: true
        pattern: ^[1-9][0-9]*$
      Chain_ID:
        name: Chain_ID
        description: The named chain that the link belongs to.
        range: CweWeakness
        pattern: ^[1-9][0-9]*$
      Ordinal:
        name: Ordinal
        description: Marks this as the link to prefer in the view.
        exact_mappings:
        - sepses_cwe:relatedWeaknessOrdinal
        range: CweOrdinal
      Dimensions:
        name: Dimensions
        description: The aspects in which the two weaknesses differ.
        range: CweDimension
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: cwe:CweRelatedWeakness
  CweWeaknessOrdinality:
    name: CweWeaknessOrdinality
    definition_uri: https://w3id.org/lmodel/cwe/CweWeaknessOrdinality
    annotations:
      xsd_type:
        tag: xsd_type
        value: WeaknessOrdinalitiesType/Weakness_Ordinality
    description: Whether a weakness tends to be a first cause or the result of another.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweWeaknessOrdinality__Ordinality
    - cweWeaknessOrdinality__Description
    attributes:
      Ordinality:
        name: Ordinality
        description: The position in the sequence of causes.
        exact_mappings:
        - sepses_cwe:weaknessOrdinality
        range: CweOrdinality
        required: true
      Description:
        name: Description
        description: The setting in which the weakness takes this position.
    class_uri: cwe:CweWeaknessOrdinality
  CweApplicablePlatforms:
    name: CweApplicablePlatforms
    definition_uri: https://w3id.org/lmodel/cwe/CweApplicablePlatforms
    annotations:
      xsd_type:
        tag: xsd_type
        value: ApplicablePlatformsType
    description: The kinds of platform where a weakness can appear.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    close_mappings:
    - sepses_cwe:ApplicablePlatform
    slots:
    - cweApplicablePlatforms__Language
    - cweApplicablePlatforms__Operating_System
    - cweApplicablePlatforms__Architecture
    - cweApplicablePlatforms__Technology
    attributes:
      Language:
        name: Language
        description: A programming language, or a family of them.
        range: CweLanguagePlatform
        multivalued: true
        inlined: true
        inlined_as_list: true
      Operating_System:
        name: Operating_System
        description: An operating system, or a family of them.
        range: CweOperatingSystemPlatform
        multivalued: true
        inlined: true
        inlined_as_list: true
      Architecture:
        name: Architecture
        description: A hardware architecture, or a family of them.
        range: CweArchitecturePlatform
        multivalued: true
        inlined: true
        inlined_as_list: true
      Technology:
        name: Technology
        description: A technology, or a family of them.
        range: CweTechnologyPlatform
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: cwe:CweApplicablePlatforms
  CweLanguagePlatform:
    name: CweLanguagePlatform
    definition_uri: https://w3id.org/lmodel/cwe/CweLanguagePlatform
    annotations:
      xsd_type:
        tag: xsd_type
        value: ApplicablePlatformsType/Language
    description: A language where a weakness can appear, named or by its family.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweLanguagePlatform__Name
    - cweLanguagePlatform__Class
    - cweLanguagePlatform__Prevalence
    - cweLanguagePlatform__Note
    attributes:
      Name:
        name: Name
        description: The name of the language.
        range: CweLanguageName
      Class:
        name: Class
        description: The family of languages.
        range: CweLanguageClass
      Prevalence:
        name: Prevalence
        description: How regularly the weakness applies here.
        range: CwePrevalence
        required: true
      Note:
        name: Note
        description: A remark on this platform.
        range: cwe_structured_text
    class_uri: cwe:CweLanguagePlatform
    any_of:
    - slot_conditions:
        Name:
          name: Name
          required: true
    - slot_conditions:
        Class:
          name: Class
          required: true
  CweOperatingSystemPlatform:
    name: CweOperatingSystemPlatform
    definition_uri: https://w3id.org/lmodel/cwe/CweOperatingSystemPlatform
    annotations:
      xsd_type:
        tag: xsd_type
        value: ApplicablePlatformsType/Operating_System
    description: An operating system where a weakness can appear, named or by its
      family.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweOperatingSystemPlatform__Name
    - cweOperatingSystemPlatform__Version
    - cweOperatingSystemPlatform__CPE_ID
    - cweOperatingSystemPlatform__Class
    - cweOperatingSystemPlatform__Prevalence
    - cweOperatingSystemPlatform__Note
    attributes:
      Name:
        name: Name
        description: The name of the operating system.
        range: CweOperatingSystemName
      Version:
        name: Version
        description: The version of the operating system.
      CPE_ID:
        name: CPE_ID
        description: The Common Platform Enumeration name of the operating system.
      Class:
        name: Class
        description: The family of operating systems.
        range: CweOperatingSystemClass
      Prevalence:
        name: Prevalence
        description: How regularly the weakness applies here.
        range: CwePrevalence
        required: true
      Note:
        name: Note
        description: A remark on this platform.
        range: cwe_structured_text
    class_uri: cwe:CweOperatingSystemPlatform
    any_of:
    - slot_conditions:
        Name:
          name: Name
          required: true
    - slot_conditions:
        Class:
          name: Class
          required: true
  CweArchitecturePlatform:
    name: CweArchitecturePlatform
    definition_uri: https://w3id.org/lmodel/cwe/CweArchitecturePlatform
    annotations:
      xsd_type:
        tag: xsd_type
        value: ApplicablePlatformsType/Architecture
    description: A hardware architecture where a weakness can appear, named or by
      its family.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweArchitecturePlatform__Name
    - cweArchitecturePlatform__Class
    - cweArchitecturePlatform__Prevalence
    - cweArchitecturePlatform__Note
    attributes:
      Name:
        name: Name
        description: The name of the architecture.
        range: CweArchitectureName
      Class:
        name: Class
        description: The family of architectures.
        range: CweArchitectureClass
      Prevalence:
        name: Prevalence
        description: How regularly the weakness applies here.
        range: CwePrevalence
        required: true
      Note:
        name: Note
        description: A remark on this platform.
        range: cwe_structured_text
    class_uri: cwe:CweArchitecturePlatform
    any_of:
    - slot_conditions:
        Name:
          name: Name
          required: true
    - slot_conditions:
        Class:
          name: Class
          required: true
  CweTechnologyPlatform:
    name: CweTechnologyPlatform
    definition_uri: https://w3id.org/lmodel/cwe/CweTechnologyPlatform
    annotations:
      xsd_type:
        tag: xsd_type
        value: ApplicablePlatformsType/Technology
    description: A technology where a weakness can appear, named or by its family.
    comments:
    - Exactly one of Name and Class would hold everywhere in CWE 5.0 but on one Technology,
      in CWE-1259, which gives both. So the rule is at least one.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweTechnologyPlatform__Name
    - cweTechnologyPlatform__Class
    - cweTechnologyPlatform__Prevalence
    - cweTechnologyPlatform__Note
    attributes:
      Name:
        name: Name
        description: The name of the technology.
        range: CweTechnologyName
      Class:
        name: Class
        description: The family of technologies.
        range: CweTechnologyClass
      Prevalence:
        name: Prevalence
        description: How regularly the weakness applies here.
        range: CwePrevalence
        required: true
      Note:
        name: Note
        description: A remark on this platform.
        range: cwe_structured_text
    class_uri: cwe:CweTechnologyPlatform
    any_of:
    - slot_conditions:
        Name:
          name: Name
          required: true
    - slot_conditions:
        Class:
          name: Class
          required: true
  CweAlternateTerm:
    name: CweAlternateTerm
    definition_uri: https://w3id.org/lmodel/cwe/CweAlternateTerm
    annotations:
      xsd_type:
        tag: xsd_type
        value: AlternateTermsType/Alternate_Term
    description: Another name people use for a weakness.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweAlternateTerm__Term
    - cweAlternateTerm__Role
    - cweAlternateTerm__Description
    attributes:
      Term:
        name: Term
        description: The name.
        close_mappings:
        - skos:altLabel
        required: true
      Role:
        name: Role
        description: The part the name plays when people talk about the weakness.
        range: CweAlternateTermRole
        multivalued: true
      Description:
        name: Description
        description: When and how the name is used.
        range: cwe_structured_text
    class_uri: cwe:CweAlternateTerm
  CweIntroduction:
    name: CweIntroduction
    definition_uri: https://w3id.org/lmodel/cwe/CweIntroduction
    annotations:
      xsd_type:
        tag: xsd_type
        value: ModesOfIntroductionType/Introduction
    description: One way a weakness can get into a product.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    close_mappings:
    - sepses_cwe:ModeOfIntroduction
    slots:
    - cweIntroduction__Phase
    - cweIntroduction__Custom_Phase
    - cweIntroduction__Note
    attributes:
      Phase:
        name: Phase
        description: A life cycle stage where the weakness can get in.
        close_mappings:
        - sepses_cwe:modeOfIntroductionPhase
        range: CwePhase
        multivalued: true
      Custom_Phase:
        name: Custom_Phase
        description: A stage from the life cycle of a field such as hardware or AI.
        range: CweCustomPhase
        multivalued: true
        inlined: true
        inlined_as_list: true
      Note:
        name: Note
        description: The usual way this happens.
        close_mappings:
        - sepses_cwe:modeOfIntroductionNote
        range: cwe_structured_text
    class_uri: cwe:CweIntroduction
  CweConsequence:
    name: CweConsequence
    definition_uri: https://w3id.org/lmodel/cwe/CweConsequence
    annotations:
      xsd_type:
        tag: xsd_type
        value: CommonConsequencesType/Consequence
    description: One thing that can follow when a weakness is exploited.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    close_mappings:
    - sepses_cwe:CommonConsequence
    slots:
    - cweConsequence__Consequence_ID
    - cweConsequence__Scope
    - cweConsequence__Impact
    - cweConsequence__Likelihood
    - cweConsequence__Note
    attributes:
      Consequence_ID:
        name: Consequence_ID
        description: An identifier for this consequence.
      Scope:
        name: Scope
        description: A security property the consequence violates.
        close_mappings:
        - sepses_cwe:consequenceScope
        range: CweScope
        required: true
        multivalued: true
      Impact:
        name: Impact
        description: What an attacker can achieve.
        close_mappings:
        - sepses_cwe:consequenceImpact
        range: CweTechnicalImpact
        required: true
        multivalued: true
      Likelihood:
        name: Likelihood
        description: How likely this consequence is beside the others.
        range: CweLikelihood
      Note:
        name: Note
        description: A remark on the consequence.
        close_mappings:
        - sepses_cwe:consequenceNote
        range: cwe_structured_text
    class_uri: cwe:CweConsequence
  CweDetectionMethod:
    name: CweDetectionMethod
    definition_uri: https://w3id.org/lmodel/cwe/CweDetectionMethod
    annotations:
      xsd_type:
        tag: xsd_type
        value: DetectionMethodsType/Detection_Method
    description: One way of finding a weakness.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    close_mappings:
    - sepses_cwe:DetectionMethod
    slots:
    - cweDetectionMethod__Detection_Method_ID
    - cweDetectionMethod__Method
    - cweDetectionMethod__Phase
    - cweDetectionMethod__Custom_Phase
    - cweDetectionMethod__Description
    - cweDetectionMethod__Effectiveness
    - cweDetectionMethod__Effectiveness_Notes
    attributes:
      Detection_Method_ID:
        name: Detection_Method_ID
        description: An identifier that lets entries share this text, such as DM-14.
      Method:
        name: Method
        description: The way of finding the weakness.
        exact_mappings:
        - sepses_cwe:detectionMethod
        range: CweDetectionMethodName
        required: true
      Phase:
        name: Phase
        description: A life cycle stage where the method applies.
        range: CwePhase
        multivalued: true
      Custom_Phase:
        name: Custom_Phase
        description: A stage from the life cycle of a field such as hardware or AI.
        range: CweCustomPhase
        multivalued: true
        inlined: true
        inlined_as_list: true
      Description:
        name: Description
        description: How the method applies to this weakness.
        exact_mappings:
        - sepses_cwe:detectionDescription
        range: cwe_structured_text
        required: true
      Effectiveness:
        name: Effectiveness
        description: How well the method finds the weakness.
        exact_mappings:
        - sepses_cwe:detectionEffectiveness
        range: CweDetectionEffectiveness
      Effectiveness_Notes:
        name: Effectiveness_Notes
        description: The strengths and limits of the method here.
        exact_mappings:
        - sepses_cwe:detectionEffectivenessNote
        range: cwe_structured_text
    class_uri: cwe:CweDetectionMethod
  CweMitigation:
    name: CweMitigation
    definition_uri: https://w3id.org/lmodel/cwe/CweMitigation
    annotations:
      xsd_type:
        tag: xsd_type
        value: PotentialMitigationsType/Mitigation
    description: One way of preventing a weakness or reducing what it can do.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    close_mappings:
    - sepses_cwe:PotentialMitigation
    slots:
    - cweMitigation__Mitigation_ID
    - cweMitigation__Phase
    - cweMitigation__Custom_Phase
    - cweMitigation__Strategy
    - cweMitigation__Description
    - cweMitigation__Effectiveness
    - cweMitigation__Effectiveness_Notes
    attributes:
      Mitigation_ID:
        name: Mitigation_ID
        description: An identifier that lets entries share this text, such as MIT-5.
      Phase:
        name: Phase
        description: A life cycle stage where the mitigation applies.
        close_mappings:
        - sepses_cwe:mitigationPhase
        range: CwePhase
        multivalued: true
      Custom_Phase:
        name: Custom_Phase
        description: A stage from the life cycle of a field such as hardware or AI.
        range: CweCustomPhase
        multivalued: true
        inlined: true
        inlined_as_list: true
      Strategy:
        name: Strategy
        description: The general approach the mitigation follows.
        range: CweMitigationStrategy
      Description:
        name: Description
        description: What to do, with its strengths and limits.
        exact_mappings:
        - sepses_cwe:mitigationDescription
        range: cwe_structured_text
        required: true
      Effectiveness:
        name: Effectiveness
        description: How well the mitigation prevents the weakness.
        exact_mappings:
        - sepses_cwe:mitigationEffectiveness
        range: CweEffectiveness
      Effectiveness_Notes:
        name: Effectiveness_Notes
        description: The strengths and limits of the mitigation here.
        exact_mappings:
        - sepses_cwe:mitigationEffectivenessNote
        range: cwe_structured_text
    class_uri: cwe:CweMitigation
  CweDemonstrativeExample:
    name: CweDemonstrativeExample
    definition_uri: https://w3id.org/lmodel/cwe/CweDemonstrativeExample
    annotations:
      xsd_type:
        tag: xsd_type
        value: DemonstrativeExamplesType/Demonstrative_Example
    description: A worked example of how a weakness looks in code.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweDemonstrativeExample__Demonstrative_Example_ID
    - cweDemonstrativeExample__Title_Text
    - cweDemonstrativeExample__Intro_Text
    - cweDemonstrativeExample__Entries
    attributes:
      Demonstrative_Example_ID:
        name: Demonstrative_Example_ID
        description: An identifier that lets entries share this example, such as DX-221.
      Title_Text:
        name: Title_Text
        description: A title for the example.
      Intro_Text:
        name: Intro_Text
        description: The setting of the code, and what it is trying to do.
        range: cwe_structured_text
        required: true
      Entries:
        name: Entries
        description: The example's prose and code, in the order they are meant to
          be read.
        comments:
        - The XSD gives this list no name, because it writes a repeating choice of
          two elements. The name is the one the CWE REST API uses, and it is the one
          key here that is not in the XSD.
        range: CweExampleEntry
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: cwe:CweDemonstrativeExample
  CweExampleEntry:
    name: CweExampleEntry
    definition_uri: https://w3id.org/lmodel/cwe/CweExampleEntry
    annotations:
      xsd_type:
        tag: xsd_type
        value: DemonstrativeExamplesType/Demonstrative_Example#choice
    description: One step of a worked example, either some prose or some code.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweExampleEntry__Body_Text
    - cweExampleEntry__Example_Code
    attributes:
      Body_Text:
        name: Body_Text
        description: Prose that explains the code around it.
        range: cwe_structured_text
      Example_Code:
        name: Example_Code
        description: A block of code.
        range: CweExampleCode
        inlined: true
    class_uri: cwe:CweExampleEntry
    exactly_one_of:
    - slot_conditions:
        Body_Text:
          name: Body_Text
          required: true
    - slot_conditions:
        Example_Code:
          name: Example_Code
          required: true
  CweExampleCode:
    name: CweExampleCode
    definition_uri: https://w3id.org/lmodel/cwe/CweExampleCode
    annotations:
      xsd_type:
        tag: xsd_type
        value: StructuredCodeType
    description: A block of code in a worked example.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweExampleCode__Nature
    - cweExampleCode__Language
    - cweExampleCode__Value
    attributes:
      Nature:
        name: Nature
        description: What the code shows.
        range: CweCodeNature
        required: true
      Language:
        name: Language
        description: The language of the code.
        range: CweLanguageName
      Value:
        name: Value
        annotations:
          xsd_text_of:
            tag: xsd_text_of
            value: StructuredTextType
        description: The code, as an XHTML fragment with its special characters escaped.
        range: cwe_structured_text
    class_uri: cwe:CweExampleCode
  CweObservedExample:
    name: CweObservedExample
    definition_uri: https://w3id.org/lmodel/cwe/CweObservedExample
    annotations:
      xsd_type:
        tag: xsd_type
        value: ObservedExampleType/Observed_Example
    description: A real case of a weakness, usually a CVE record.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweObservedExample__Reference
    - cweObservedExample__Description
    - cweObservedExample__Link
    - cweObservedExample__Rationale
    attributes:
      Reference:
        name: Reference
        description: The identifier of the case, such as a CVE identifier.
        comments:
        - In CWE 5.0 it holds a CVE identifier in 3173 of 3183 cases and an external
          reference such as [REF-1100] in the rest, so lmodel/cve's cveId is only
          related.
        related_mappings:
        - cve:cveId
        required: true
      Description:
        name: Description
        description: What went wrong in that case, as it bears on the weakness.
        range: cwe_structured_text
        required: true
      Link:
        name: Link
        description: An address with more about the case.
        range: uri
        required: true
      Rationale:
        name: Rationale
        description: A hint at why this case was chosen.
        range: CweObservedExampleRationale
        multivalued: true
    class_uri: cwe:CweObservedExample
  CweRelatedAttackPattern:
    name: CweRelatedAttackPattern
    definition_uri: https://w3id.org/lmodel/cwe/CweRelatedAttackPattern
    annotations:
      xsd_type:
        tag: xsd_type
        value: RelatedAttackPatternsType/Related_Attack_Pattern
    description: A pointer from a weakness to an attack pattern in the CAPEC list.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweRelatedAttackPattern__CAPEC_ID
    attributes:
      CAPEC_ID:
        name: CAPEC_ID
        description: The number of the attack pattern in the CAPEC list.
        range: cwe_capec_id
        required: true
    class_uri: cwe:CweRelatedAttackPattern
  CweStakeholder:
    name: CweStakeholder
    definition_uri: https://w3id.org/lmodel/cwe/CweStakeholder
    annotations:
      xsd_type:
        tag: xsd_type
        value: AudienceType/Stakeholder
    description: A group of people who may find a view useful.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweStakeholder__Type
    - cweStakeholder__Description
    attributes:
      Type:
        name: Type
        description: The group.
        range: CweStakeholderType
        required: true
      Description:
        name: Description
        description: What in the view this group may find useful.
    class_uri: cwe:CweStakeholder
  CweMember:
    name: CweMember
    definition_uri: https://w3id.org/lmodel/cwe/CweMember
    annotations:
      xsd_type:
        tag: xsd_type
        value: MemberType
    description: A link from a grouping or a view to an entry it holds or belongs
      to, in one view.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweMember__CWE_ID
    - cweMember__View_ID
    - cweMember__Dimensions
    attributes:
      CWE_ID:
        name: CWE_ID
        description: The entry at the other end of the link.
        range: CweEntry
        required: true
        pattern: ^[1-9][0-9]*$
      View_ID:
        name: View_ID
        description: The view in which the link holds.
        range: CweView
        required: true
        pattern: ^[1-9][0-9]*$
      Dimensions:
        name: Dimensions
        description: The aspects in which the two entries differ.
        range: CweDimension
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: cwe:CweMember
  CweRelationships:
    name: CweRelationships
    definition_uri: https://w3id.org/lmodel/cwe/CweRelationships
    annotations:
      xsd_type:
        tag: xsd_type
        value: RelationshipsType
    description: The entries that a grouping or a view holds or belongs to.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweRelationships__Member_Of
    - cweRelationships__Has_Member
    attributes:
      Member_Of:
        name: Member_Of
        description: An entry that holds this one.
        range: CweMember
        multivalued: true
        inlined: true
        inlined_as_list: true
      Has_Member:
        name: Has_Member
        description: An entry that this one holds.
        range: CweMember
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: cwe:CweRelationships
    any_of:
    - slot_conditions:
        Member_Of:
          name: Member_Of
          required: true
    - slot_conditions:
        Has_Member:
          name: Has_Member
          required: true
  CweMappingNotes:
    name: CweMappingNotes
    definition_uri: https://w3id.org/lmodel/cwe/CweMappingNotes
    annotations:
      xsd_type:
        tag: xsd_type
        value: MappingNotesType
    description: Guidance on whether to map a real vulnerability to an entry, and
      on what to use instead.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweMappingNotes__Usage
    - cweMappingNotes__Rationale
    - cweMappingNotes__Comments
    - cweMappingNotes__Reasons
    - cweMappingNotes__Suggestions
    attributes:
      Usage:
        name: Usage
        description: Whether the entry may be used for mapping.
        exact_mappings:
        - sepses_cwe:mappingUsage
        range: CweUsage
        required: true
      Rationale:
        name: Rationale
        description: Why the entry has that usage.
        range: cwe_structured_text
        required: true
      Comments:
        name: Comments
        description: More advice for someone mapping to the entry.
        range: cwe_structured_text
        required: true
      Reasons:
        name: Reasons
        description: Short labels that sum up the usage.
        range: CweMappingReason
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      Suggestions:
        name: Suggestions
        description: Other weaknesses that may suit the mapping better.
        range: CweMappingSuggestion
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: cwe:CweMappingNotes
  CweMappingReason:
    name: CweMappingReason
    definition_uri: https://w3id.org/lmodel/cwe/CweMappingReason
    annotations:
      xsd_type:
        tag: xsd_type
        value: ReasonsType/Reason
    description: One short label that sums up the usage of an entry.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweMappingReason__Type
    attributes:
      Type:
        name: Type
        description: The label.
        range: CweReason
        required: true
    class_uri: cwe:CweMappingReason
  CweMappingSuggestion:
    name: CweMappingSuggestion
    definition_uri: https://w3id.org/lmodel/cwe/CweMappingSuggestion
    annotations:
      xsd_type:
        tag: xsd_type
        value: SuggestionsType/Suggestion
    description: A weakness that may suit a mapping better than this entry.
    from_schema: https://w3id.org/lmodel/cwe/cwe_entries
    slots:
    - cweMappingSuggestion__CWE_ID
    - cweMappingSuggestion__Comment
    attributes:
      CWE_ID:
        name: CWE_ID
        description: The suggested weakness.
        range: CweWeakness
        required: true
        pattern: ^[1-9][0-9]*$
      Comment:
        name: Comment
        description: When the suggestion applies.
        required: true
    class_uri: cwe:CweMappingSuggestion
