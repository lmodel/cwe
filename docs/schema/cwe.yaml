          weakness.
      Language-Variety:
        text: Language-Variety
      Product-Variety:
        text: Product-Variety
      Attack-Surface:
        text: Attack-Surface
      Other:
        text: Other
  CweReferenceAccessRestriction:
    name: CweReferenceAccessRestriction
    definition_uri: https://w3id.org/lmodel/cwe/CweReferenceAccessRestriction
    annotations:
      xsd_type:
        tag: xsd_type
        value: ReferenceAccessRestrictionsEnumeration
    description: What stands between a reader and a cited source.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      None:
        text: None
        description: Anybody on the internet can read it for free.
      Proprietary-Subscription:
        text: Proprietary-Subscription
        description: Only paying subscribers can read it.
      Minimal-Registration:
        text: Minimal-Registration
        description: A reader must register, at no cost, to read it.
      Removed:
        text: Removed
        description: It has been taken down and may have no other copy.
      Other:
        text: Other
  CweReferenceMediaType:
    name: CweReferenceMediaType
    definition_uri: https://w3id.org/lmodel/cwe/CweReferenceMediaType
    annotations:
      xsd_type:
        tag: xsd_type
        value: ReferenceMediaTypeEnumeration
    description: The form a cited source takes, which affects how easily people can
      use it.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      Text:
        text: Text
        description: Plain text or a format that is easy to parse, as HTML with no
          scripts is.
      Common-Proprietary-Text:
        text: Common-Proprietary-Text
        description: A widely used proprietary format for text, such as PDF or a word
          processor file.
      Video:
        text: Video
        description: A recording with pictures, such as a conference talk.
      Audio:
        text: Audio
        description: A recording with sound and no pictures.
      Other:
        text: Other
        description: Some other format, which may be harder for some readers to use.
  CweReferenceRationale:
    name: CweReferenceRationale
    definition_uri: https://w3id.org/lmodel/cwe/CweReferenceRationale
    annotations:
      xsd_type:
        tag: xsd_type
        value: ReferenceRationaleEnumeration
    description: A hint at why a source was cited.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      Example:
        text: Example
        description: It gives more detail on an example in the entry, and may be where
          the example came from.
      Early-Publication:
        text: Early-Publication
        description: One of the first publications to explain the weakness or how
          it is exploited.
      Influential/Newsworthy:
        text: Influential/Newsworthy
        description: A publication that drew attention or shaped how people see the
          weakness.
      Manual/Man Pages:
        text: Manual/Man Pages
        description: Technical reference material that gives background and is not
          about the weakness itself.
      Mitigation-Based:
        text: Mitigation-Based
        description: It proposes ways to reduce or remove weaknesses across a whole
          system.
      Secure-Development-Rules:
        text: Secure-Development-Rules
        description: It points to formal rules or guides for developing securely.
      Other:
        text: Other
  CweContributionType:
    name: CweContributionType
    definition_uri: https://w3id.org/lmodel/cwe/CweContributionType
