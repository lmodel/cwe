name: cwe
annotations:
  xsd_version:
    tag: xsd_version
    value: '8.0'
  xsd_namespace:
    tag: xsd_namespace
    value: http://cwe.mitre.org/cwe-8
  xsd_date:
    tag: xsd_date
    value: '2026-10-28'
description: A LinkML model of the Common Weakness Enumeration, the catalogue of software
  and hardware weakness types that The MITRE Corporation publishes for the CWE Program.
  It renders the catalogue's XML Schema with its own element names and values, so
  the whole catalogue validates with both unchanged.
title: Common Weakness Enumeration (CWE) List and Schema
comments:
- The version is the edition of the CWE List that the schema renders, which is the
  first edition under XML Schema 8.0. upstream/ holds both files unchanged, tests/test_coverage.py
  holds the schema to the XSD, and scripts/check_upstream_release.py reports when
  either moves.
- The file behind the cwe_schema_latest.xsd link is an earlier copy of 8.0, which
  the catalogue breaks in 69 places. The source above is the file the catalogue itself
  names, and it validates with no error.
source: https://cwe.mitre.org/data/xsd/cwe_schema_v8.0.xsd
see_also:
- https://lmodel.github.io/cwe
- https://cwe.mitre.org/
keywords:
- weakness
- CWE
- root cause mapping
- software weakness
- hardware weakness
- secure coding
id: https://w3id.org/lmodel/cwe
version: '5.0'
imports:
- linkml:types
- ./cwe_core
- ./cwe_entries
license: Apache-2.0
prefixes:
  cwe:
    prefix_prefix: cwe
    prefix_reference: https://w3id.org/lmodel/cwe/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  skos:
    prefix_prefix: skos
    prefix_reference: http://www.w3.org/2004/02/skos/core#
  wd:
    prefix_prefix: wd
    prefix_reference: http://www.wikidata.org/entity/
default_prefix: cwe
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  cwe_entry_id:
    name: cwe_entry_id
    definition_uri: https://w3id.org/lmodel/cwe/CweEntryId
    annotations:
      xsd_type:
        tag: xsd_type
        value: xs:integer
    description: The number that identifies an entry of the CWE List, written as text,
      such as 79.
    comments:
    - The XSD types it as an integer. It stays a string because LinkML's RDF dumper
      needs an identifier it can expand, and the catalogue's XML holds text anyway.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[1-9][0-9]*$
  cwe_capec_id:
    name: cwe_capec_id
    definition_uri: https://w3id.org/lmodel/cwe/CweCapecId
    annotations:
      xsd_type:
        tag: xsd_type
        value: xs:integer
    description: The number of an attack pattern in the CAPEC list, written as text,
      such as 63.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[1-9][0-9]*$
  cwe_reference_id:
    name: cwe_reference_id
    definition_uri: https://w3id.org/lmodel/cwe/CweReferenceId
    annotations:
      xsd_type:
        tag: xsd_type
        value: xs:string
    description: The identifier of an external reference in the catalogue, such as
      REF-1.
    comments:
    - The XSD types it as a string with no pattern. CWE 5.0 writes REF and a number
      on all but one, whose identifier is the bare number 1300.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    typeof: string
    base: str
    uri: xsd:string
  cwe_structured_text:
    name: cwe_structured_text
    definition_uri: https://w3id.org/lmodel/cwe/CweStructuredText
    annotations:
      xsd_type:
        tag: xsd_type
        value: StructuredTextType
    description: Text that may hold XHTML markup, kept as a well-formed fragment without
      the namespace prefix and with its special characters escaped.
    comments:
    - A consumer that shows this text as HTML must sanitize it first, since it can
      quote attack strings.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    typeof: string
    base: str
    uri: xsd:string
  cwe_publication_year:
    name: cwe_publication_year
    definition_uri: https://w3id.org/lmodel/cwe/CwePublicationYear
    annotations:
      xsd_type:
        tag: xsd_type
        value: xs:gYear
    description: A year in XML Schema's form, such as 2021.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    typeof: string
    base: str
    uri: xsd:gYear
    pattern: ^-?[0-9]{4,}(Z|[+-][0-9]{2}:[0-9]{2})?$
  cwe_publication_month:
    name: cwe_publication_month
    definition_uri: https://w3id.org/lmodel/cwe/CwePublicationMonth
    annotations:
      xsd_type:
        tag: xsd_type
        value: xs:gMonth
    description: A month in XML Schema's form, two hyphens and two digits, such as
      --03.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    typeof: string
    base: str
    uri: xsd:gMonth
    pattern: ^--(0[1-9]|1[0-2])(Z|[+-][0-9]{2}:[0-9]{2})?$
  cwe_publication_day:
    name: cwe_publication_day
    definition_uri: https://w3id.org/lmodel/cwe/CwePublicationDay
    annotations:
      xsd_type:
        tag: xsd_type
        value: xs:gDay
    description: A day of the month in XML Schema's form, three hyphens and two digits,
      such as ---06.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    typeof: string
    base: str
    uri: xsd:gDay
    pattern: ^---(0[1-9]|[12][0-9]|3[01])(Z|[+-][0-9]{2}:[0-9]{2})?$
enums:
  CweAbstraction:
    name: CweAbstraction
    definition_uri: https://w3id.org/lmodel/cwe/CweAbstraction
    annotations:
      xsd_type:
        tag: xsd_type
        value: AbstractionEnumeration
    description: How far a weakness is described in general terms or tied to a specific
      product or resource.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      Pillar:
        text: Pillar
        description: The most general level, a theme that the weaknesses under it
          share.
      Class:
        text: Class
        description: A very general weakness, usually independent of any language
          or technology.
      Base:
        text: Base
        description: A weakness general enough to apply widely and detailed enough
          to find or prevent it.
      Variant:
        text: Variant
        description: A weakness tied to a particular language, technology or kind
          of product.
      Compound:
        text: Compound
        description: An entry that ties two or more weaknesses together, as a chain
          or a composite.
  CweAlternateTermRole:
    name: CweAlternateTermRole
    definition_uri: https://w3id.org/lmodel/cwe/CweAlternateTermRole
    annotations:
      xsd_type:
        tag: xsd_type
        value: AlternateTermRoleEnumeration
    description: The part an alternate term plays when people talk about a weakness.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      Abbreviation:
        text: Abbreviation
      Acronym:
        text: Acronym
      Alternate-Spelling:
        text: Alternate-Spelling
      Attack-Focused:
        text: Attack-Focused
      Impact-Oriented:
        text: Impact-Oriented
      Multi-Weakness:
        text: Multi-Weakness
      Multiple-Interpretation:
        text: Multiple-Interpretation
      Common-Name:
        text: Common-Name
      Discouraged:
        text: Discouraged
      Legacy:
        text: Legacy
      Other:
        text: Other
  CweArchitectureClass:
    name: CweArchitectureClass
    definition_uri: https://w3id.org/lmodel/cwe/CweArchitectureClass
    annotations:
      xsd_type:
        tag: xsd_type
        value: ArchitectureClassEnumeration
    description: A broad family of hardware architectures.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      Embedded:
        text: Embedded
      Microcomputer:
        text: Microcomputer
      Workstation:
        text: Workstation
      Not Architecture-Specific:
        text: Not Architecture-Specific
        description: The weakness can appear on many architectures.
  CweArchitectureName:
    name: CweArchitectureName
    definition_uri: https://w3id.org/lmodel/cwe/CweArchitectureName
    annotations:
      xsd_type:
        tag: xsd_type
        value: ArchitectureNameEnumeration
    description: A named hardware architecture.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      Alpha:
        text: Alpha
      ARM:
        text: ARM
      Itanium:
        text: Itanium
      Power Architecture:
        text: Power Architecture
      SPARC:
        text: SPARC
      x86:
        text: x86
      Other:
        text: Other
  CweDetectionMethodName:
    name: CweDetectionMethodName
    definition_uri: https://w3id.org/lmodel/cwe/CweDetectionMethodName
    annotations:
      xsd_type:
        tag: xsd_type
        value: DetectionMethodEnumeration
    description: A way of finding a weakness.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      Automated Analysis:
        text: Automated Analysis
      Automated Dynamic Analysis:
        text: Automated Dynamic Analysis
      Automated Static Analysis:
        text: Automated Static Analysis
      Automated Static Analysis - Source Code:
        text: Automated Static Analysis - Source Code
      Automated Static Analysis - Binary or Bytecode:
        text: Automated Static Analysis - Binary or Bytecode
      Fuzzing:
        text: Fuzzing
      Manual Analysis:
        text: Manual Analysis
      Manual Dynamic Analysis:
        text: Manual Dynamic Analysis
      Manual Static Analysis:
        text: Manual Static Analysis
      Manual Static Analysis - Source Code:
        text: Manual Static Analysis - Source Code
      Manual Static Analysis - Binary or Bytecode:
        text: Manual Static Analysis - Binary or Bytecode
      White Box:
        text: White Box
      Black Box:
        text: Black Box
      Architecture or Design Review:
        text: Architecture or Design Review
      Dynamic Analysis with Manual Results Interpretation:
        text: Dynamic Analysis with Manual Results Interpretation
      Dynamic Analysis with Automated Results Interpretation:
        text: Dynamic Analysis with Automated Results Interpretation
      Formal Verification:
        text: Formal Verification
      Simulation / Emulation:
        text: Simulation / Emulation
      Other:
        text: Other
  CweDetectionEffectiveness:
    name: CweDetectionEffectiveness
    definition_uri: https://w3id.org/lmodel/cwe/CweDetectionEffectiveness
    annotations:
      xsd_type:
        tag: xsd_type
        value: DetectionEffectivenessEnumeration
    description: How well a detection method finds a weakness.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      High:
        text: High
        description: It finds the weakness often and with few false reports.
      Moderate:
        text: Moderate
        description: It works in several situations but misses some forms or gives
          some false reports.
      SOAR Partial:
        text: SOAR Partial
        description: The State Of the Art Report rates it as cost-effective for part
          of the job.
      Opportunistic:
        text: Opportunistic
        description: It does not aim at this weakness and finds it only by the way.
      Limited:
        text: Limited
        description: It helps only in some situations.
      None:
        text: None
        description: It does not find the weakness.
  CweEffectiveness:
    name: CweEffectiveness
    definition_uri: https://w3id.org/lmodel/cwe/CweEffectiveness
    annotations:
      xsd_type:
        tag: xsd_type
        value: EffectivenessEnumeration
    description: How well a mitigation prevents a weakness.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      High:
        text: High
        description: It often removes the weakness altogether.
      Moderate:
        text: Moderate
        description: It prevents several forms of the weakness but does not cover
          them all.
      Limited:
        text: Limited
        description: It helps only in some situations or against some forms of the
          weakness.
      Incidental:
        text: Incidental
        description: It protects by chance and cannot be relied on.
      Discouraged Common Practice:
        text: Discouraged Common Practice
        description: A habit people often follow that does not work well enough to
          recommend.
      Defense in Depth:
        text: Defense in Depth
        description: It adds a layer of protection and does not remove the weakness
          by itself.
      None:
        text: None
        description: It does not prevent the weakness.
  CweFunctionalArea:
    name: CweFunctionalArea
    definition_uri: https://w3id.org/lmodel/cwe/CweFunctionalArea
    annotations:
      xsd_type:
        tag: xsd_type
        value: FunctionalAreaEnumeration
    description: The part of a product where a weakness is most likely to appear.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      Authentication:
        text: Authentication
      Authorization:
        text: Authorization
      Code Libraries:
        text: Code Libraries
      Counters:
        text: Counters
      Cryptography:
        text: Cryptography
      Error Handling:
        text: Error Handling
      Interprocess Communication:
        text: Interprocess Communication
      File Processing:
        text: File Processing
      Logging:
        text: Logging
      Memory Management:
        text: Memory Management
      Networking:
        text: Networking
      Number Processing:
        text: Number Processing
      Program Invocation:
        text: Program Invocation
      Protection Mechanism:
        text: Protection Mechanism
      Session Management:
        text: Session Management
      Signals:
        text: Signals
      String Processing:
        text: String Processing
      Not Functional-Area-Specific:
        text: Not Functional-Area-Specific
      Power:
        text: Power
      Clock:
        text: Clock
  CweImportance:
    name: CweImportance
    definition_uri: https://w3id.org/lmodel/cwe/CweImportance
    annotations:
      xsd_type:
        tag: xsd_type
        value: ImportanceEnumeration
    description: How much a change to an entry matters to people who already rely
      on it.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      Normal:
        text: Normal
      Critical:
        text: Critical
        description: The change alters what the entry means or how it may be read.
  CweLanguageClass:
    name: CweLanguageClass
    definition_uri: https://w3id.org/lmodel/cwe/CweLanguageClass
    annotations:
      xsd_type:
        tag: xsd_type
        value: LanguageClassEnumeration
    description: A broad family of programming languages.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      Assembly:
        text: Assembly
      Compiled:
        text: Compiled
      Hardware Description Language:
        text: Hardware Description Language
      Interpreted:
        text: Interpreted
      Object-Oriented:
        text: Object-Oriented
      Memory-Unsafe:
        text: Memory-Unsafe
      Not Language-Specific:
        text: Not Language-Specific
        description: The weakness can appear in many languages.
