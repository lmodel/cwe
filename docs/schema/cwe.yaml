      xsd_type:
        tag: xsd_type
        value: ContentHistoryType/Contribution/@Type
    description: What a contribution to an entry consisted of.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      Content:
        text: Content
        description: Content given to the entry.
      Feedback:
        text: Feedback
        description: Feedback on the entry.
