  CweRelatedNature:
    name: CweRelatedNature
    definition_uri: https://w3id.org/lmodel/cwe/CweRelatedNature
    annotations:
      xsd_type:
        tag: xsd_type
        value: RelatedNatureEnumeration
    description: How one weakness relates to another.
    comments:
    - ChildOf and ParentOf are inverses, as are CanPrecede and CanFollow, and Requires
      and RequiredBy. PeerOf and Overlaps read the same in both directions, as the
      CWE news article of 2026-10-28 says. The XSD says CanAlsoBe need not be reciprocal.
    from_schema: https://w3id.org/lmodel/cwe/cwe_core
    permissible_values:
      ChildOf:
        text: ChildOf
        description: The related weakness is more general than this one.
        close_mappings:
        - skos:broader
      ParentOf:
        text: ParentOf
        description: The related weakness is more specific than this one.
        close_mappings:
        - skos:narrower
      StartsWith:
        text: StartsWith
        description: 'For a named chain only: the related weakness is where the chain
          begins.'
      CanFollow:
        text: CanFollow
        description: In a chain, the related weakness can come before this one.
      CanPrecede:
        text: CanPrecede
        description: In a chain, the related weakness can come after this one.
      RequiredBy:
        text: RequiredBy
        description: 'For composites only: the related composite needs this weakness
          to be present.'
      Requires:
        text: Requires
        description: 'For composites only: this composite needs the related weakness
          to be present.'
      CanAlsoBe:
        text: CanAlsoBe
        description: In some settings this weakness may be seen as the related one,
          with neither being a parent of the other.
      PeerOf:
        text: PeerOf
        description: The two are similar in a way that no other nature fits.
        related_mappings:
        - skos:related
      Overlaps:
        text: Overlaps
        description: The two weaknesses share some ground, which CWE would rather
          avoid.
