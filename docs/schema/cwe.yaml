    - related_attack_patterns
    - related_weaknesses
    - references
    - Weakness_mapping_notes
    - notes
    - Weakness_content_history
    - tags
    - source
    slot_usage:
      id:
        name: id
        identifier: true
        required: true
      name:
        name: name
        required: true
      description:
        name: description
        required: true
      abstraction:
        name: abstraction
        required: true
      structure:
        name: structure
        required: true
      status:
        name: status
        required: true
      mapping_notes:
