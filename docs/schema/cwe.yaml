name: cwe
annotations:
  xsd_schema_version:
    tag: xsd_schema_version
    value: '7.3'
  xsd_namespace:
    tag: xsd_namespace
    value: http://cwe.mitre.org/cwe-7
  source_columns:
    tag: source_columns
    value: CWE-ID,CWE Name,Source
description: 'MITRE Common Weakness Enumeration (CWE) LinkML Schema.


  Self-contained schema covering the full MITRE CWE XSD: weakness entries,

  categories, views, external references, and NVD weakness observations (CWE-ID,

  CWE Name, Source).'
title: cwe
source: https://cwe.mitre.org/data/downloads.html
see_also:
- https://lmodel.github.io/cwe
- https://cwe.mitre.org/data/index.html
- https://nvd.nist.gov/
id: https://w3id.org/lmodel/cwe
version: '7.3'
imports:
- linkml:types
license: Apache-2.0
prefixes:
  capec:
    prefix_prefix: capec
    prefix_reference: https://w3id.org/lmodel/capec/
  cwe:
    prefix_prefix: cwe
    prefix_reference: https://w3id.org/lmodel/cwe/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  dct:
    prefix_prefix: dct
    prefix_reference: http://purl.org/dc/terms/
  skos:
    prefix_prefix: skos
    prefix_reference: http://www.w3.org/2004/02/skos/core#
  rdfs:
    prefix_prefix: rdfs
    prefix_reference: http://www.w3.org/2000/01/rdf-schema#
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
  WIKIDATA:
    prefix_prefix: WIKIDATA
    prefix_reference: https://www.wikidata.org/wiki/
default_prefix: cwe
default_range: string
subsets:
  cwe_dictionary:
    name: cwe_dictionary
    definition_uri: https://w3id.org/lmodel/cwe/CweDictionary
    description: Canonical MITRE CWE dictionary records.
    from_schema: https://w3id.org/lmodel/cwe
  nvd_weakness_observation:
    name: nvd_weakness_observation
    definition_uri: https://w3id.org/lmodel/cwe/NvdWeaknessObservation
    description: Weakness rows observed in NVD vulnerability detail pages.
    from_schema: https://w3id.org/lmodel/cwe
types:
  CveId:
    name: CveId
    definition_uri: https://w3id.org/lmodel/cwe/CveId
    description: 'A CVE identifier assigned by a CVE Numbering Authority (CNA). Format:
      CVE-YYYY-NNNNN.'
    from_schema: https://w3id.org/lmodel/cwe
    base: str
    uri: xsd:string
    pattern: ^CVE-[0-9]{4}-[0-9]+$
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  WeaknessSource:
    name: WeaknessSource
    definition_uri: https://w3id.org/lmodel/cwe/WeaknessSource
    description: Source attribution for weakness data in NVD/CVE contexts.
    from_schema: https://w3id.org/lmodel/cwe
    permissible_values:
      MITRE:
        text: MITRE
        description: Data sourced from MITRE CWE content.
      NIST:
        text: NIST
        description: Data produced by NIST/NVD analysis.
      ASSIGNER:
        text: ASSIGNER
        description: Data provided by the CVE assigner/CNA.
      CNA:
        text: CNA
        description: Data provided by a CVE Numbering Authority.
      OTHER:
        text: OTHER
        description: Other or unspecified source.
  WeaknessAbstraction:
    name: WeaknessAbstraction
    definition_uri: https://w3id.org/lmodel/cwe/WeaknessAbstraction
    description: CWE abstraction layer (AbstractionEnumeration in XSD).
    from_schema: https://w3id.org/lmodel/cwe
    permissible_values:
      PILLAR:
        text: PILLAR
        description: Most abstract type; a theme for all class/base/variant weaknesses.
      CLASS:
        text: CLASS
        description: Abstract, independent of any specific language or technology.
      BASE:
        text: BASE
        description: Mostly independent of resource or technology; supports detection/prevention.
      VARIANT:
        text: VARIANT
        description: Linked to a specific language or technology.
      COMPOUND:
        text: COMPOUND
        description: "Meaningful aggregation \u2014 Chain or Composite."
  WeaknessStatus:
    name: WeaknessStatus
    definition_uri: https://w3id.org/lmodel/cwe/WeaknessStatus
    description: Lifecycle status of a CWE entry, category, or view (StatusEnumeration
      in XSD).
    from_schema: https://w3id.org/lmodel/cwe
    permissible_values:
      DEPRECATED:
        text: DEPRECATED
        description: Removed from CWE; likely a duplicate or created in error.
      DRAFT:
        text: DRAFT
        description: All important elements filled; may still have problems or gaps.
      INCOMPLETE:
        text: INCOMPLETE
        description: Not all important elements filled; quality not guaranteed.
      OBSOLETE:
        text: OBSOLETE
        description: Still valid but no longer relevant; likely superseded.
      STABLE:
        text: STABLE
        description: All important elements verified; unlikely to change significantly.
      USABLE:
        text: USABLE
        description: Has received close extensive review; critical elements verified.
  WeaknessStructure:
    name: WeaknessStructure
    definition_uri: https://w3id.org/lmodel/cwe/WeaknessStructure
    description: Structural nature of a weakness (StructureEnumeration in XSD).
    from_schema: https://w3id.org/lmodel/cwe
    permissible_values:
      SIMPLE:
        text: SIMPLE
        description: Single weakness whose exploitation is not dependent on another
          weakness.
      CHAIN:
        text: CHAIN
        description: Set of weaknesses reachable consecutively to produce a vulnerability.
      COMPOSITE:
        text: COMPOSITE
        description: Set of weaknesses that must all be present simultaneously.
  LikelihoodLevel:
    name: LikelihoodLevel
    definition_uri: https://w3id.org/lmodel/cwe/LikelihoodLevel
    description: Likelihood of exploitation or occurrence (LikelihoodEnumeration in
      XSD).
    from_schema: https://w3id.org/lmodel/cwe
    permissible_values:
      HIGH:
        text: HIGH
      MEDIUM:
        text: MEDIUM
      LOW:
        text: LOW
      UNKNOWN:
        text: UNKNOWN
        description: Actual likelihood is not known.
  WeaknessRelationNature:
    name: WeaknessRelationNature
    definition_uri: https://w3id.org/lmodel/cwe/WeaknessRelationNature
    description: Nature of a directional relationship between two CWE entries (RelatedNatureEnumeration
      in XSD).
    from_schema: https://w3id.org/lmodel/cwe
    permissible_values:
      CHILD_OF:
        text: CHILD_OF
        description: Related weakness at a higher level of abstraction.
      PARENT_OF:
        text: PARENT_OF
        description: Related weakness at a lower level of abstraction.
      STARTS_WITH:
        text: STARTS_WITH
        description: Chaining; this weakness starts the chain.
      CAN_FOLLOW:
        text: CAN_FOLLOW
        description: Chaining; this weakness can follow the target.
      CAN_PRECEDE:
        text: CAN_PRECEDE
        description: Chaining; this weakness can precede the target.
      REQUIRED_BY:
        text: REQUIRED_BY
        description: Composite; this weakness is required by the target.
      REQUIRES:
        text: REQUIRES
        description: Composite; this weakness requires the target.
      CAN_ALSO_BE:
        text: CAN_ALSO_BE
        description: In proper context can also be perceived as the target weakness.
      PEER_OF:
        text: PEER_OF
        description: Shows similarity with the target; no precise fit elsewhere.
  WeaknessOrdinalityLevel:
    name: WeaknessOrdinalityLevel
    definition_uri: https://w3id.org/lmodel/cwe/WeaknessOrdinalityLevel
    description: Potential ordering relationship of a weakness relative to others
      (OrdinalityEnumeration in XSD).
    from_schema: https://w3id.org/lmodel/cwe
    permissible_values:
      PRIMARY:
        text: PRIMARY
        description: Weakness exists independent of other weaknesses.
      RESULTANT:
        text: RESULTANT
        description: Weakness exists only in the presence of other weaknesses.
      INDIRECT:
        text: INDIRECT
        description: Does not directly lead to security weaknesses but may facilitate
          them.
  OrdinalQualifier:
    name: OrdinalQualifier
    definition_uri: https://w3id.org/lmodel/cwe/OrdinalQualifier
    description: Marks a related-weakness relationship as the primary one for a given
      <Nature, CWE_ID, View_ID> triple (OrdinalEnumeration in XSD).
    from_schema: https://w3id.org/lmodel/cwe
    permissible_values:
      PRIMARY:
        text: PRIMARY
        description: Primary ChildOf relationship for this weakness in the given view.
  SecurityScope:
    name: SecurityScope
    definition_uri: https://w3id.org/lmodel/cwe/SecurityScope
    description: Security property area that can be violated by exploiting a weakness
      (ScopeEnumeration in XSD).
    from_schema: https://w3id.org/lmodel/cwe
    permissible_values:
      CONFIDENTIALITY:
        text: CONFIDENTIALITY
      INTEGRITY:
        text: INTEGRITY
      AVAILABILITY:
        text: AVAILABILITY
      ACCESS_CONTROL:
        text: ACCESS_CONTROL
      ACCOUNTABILITY:
        text: ACCOUNTABILITY
      AUTHENTICATION:
        text: AUTHENTICATION
      AUTHORIZATION:
        text: AUTHORIZATION
      NON_REPUDIATION:
        text: NON_REPUDIATION
      OTHER:
        text: OTHER
  TechnicalImpact:
    name: TechnicalImpact
    definition_uri: https://w3id.org/lmodel/cwe/TechnicalImpact
    description: Technical impact of successfully exploiting a weakness (TechnicalImpactEnumeration
      in XSD).
    from_schema: https://w3id.org/lmodel/cwe
    permissible_values:
      MODIFY_MEMORY:
        text: MODIFY_MEMORY
      READ_MEMORY:
        text: READ_MEMORY
      MODIFY_FILES_OR_DIRECTORIES:
        text: MODIFY_FILES_OR_DIRECTORIES
      READ_FILES_OR_DIRECTORIES:
        text: READ_FILES_OR_DIRECTORIES
      MODIFY_APPLICATION_DATA:
        text: MODIFY_APPLICATION_DATA
      READ_APPLICATION_DATA:
        text: READ_APPLICATION_DATA
      DOS_CRASH_EXIT_OR_RESTART:
        text: DOS_CRASH_EXIT_OR_RESTART
        description: 'DoS: Crash, Exit, or Restart'
      DOS_AMPLIFICATION:
        text: DOS_AMPLIFICATION
        description: 'DoS: Amplification'
      DOS_INSTABILITY:
        text: DOS_INSTABILITY
        description: 'DoS: Instability'
      DOS_RESOURCE_CONSUMPTION_CPU:
        text: DOS_RESOURCE_CONSUMPTION_CPU
        description: 'DoS: Resource Consumption (CPU)'
      DOS_RESOURCE_CONSUMPTION_MEMORY:
        text: DOS_RESOURCE_CONSUMPTION_MEMORY
        description: 'DoS: Resource Consumption (Memory)'
      DOS_RESOURCE_CONSUMPTION_OTHER:
        text: DOS_RESOURCE_CONSUMPTION_OTHER
        description: 'DoS: Resource Consumption (Other)'
      EXECUTE_UNAUTHORIZED_CODE_OR_COMMANDS:
        text: EXECUTE_UNAUTHORIZED_CODE_OR_COMMANDS
      GAIN_PRIVILEGES_OR_ASSUME_IDENTITY:
        text: GAIN_PRIVILEGES_OR_ASSUME_IDENTITY
      BYPASS_PROTECTION_MECHANISM:
        text: BYPASS_PROTECTION_MECHANISM
      HIDE_ACTIVITIES:
        text: HIDE_ACTIVITIES
      ALTER_EXECUTION_LOGIC:
        text: ALTER_EXECUTION_LOGIC
      QUALITY_DEGRADATION:
        text: QUALITY_DEGRADATION
      UNEXPECTED_STATE:
        text: UNEXPECTED_STATE
      VARIES_BY_CONTEXT:
        text: VARIES_BY_CONTEXT
      INCREASE_ANALYTICAL_COMPLEXITY:
        text: INCREASE_ANALYTICAL_COMPLEXITY
        description: Makes vulnerability harder to find and fix.
      REDUCE_MAINTAINABILITY:
        text: REDUCE_MAINTAINABILITY
      REDUCE_PERFORMANCE:
        text: REDUCE_PERFORMANCE
      REDUCE_RELIABILITY:
        text: REDUCE_RELIABILITY
      OTHER:
        text: OTHER
  LifecyclePhase:
    name: LifecyclePhase
    definition_uri: https://w3id.org/lmodel/cwe/LifecyclePhase
    description: Phase in the product lifecycle where a weakness may be introduced
      or a mitigation applied (PhaseEnumeration in XSD).
    from_schema: https://w3id.org/lmodel/cwe
    permissible_values:
      POLICY:
        text: POLICY
      REQUIREMENTS:
        text: REQUIREMENTS
      ARCHITECTURE_AND_DESIGN:
        text: ARCHITECTURE_AND_DESIGN
      IMPLEMENTATION:
        text: IMPLEMENTATION
      BUILD_AND_COMPILATION:
        text: BUILD_AND_COMPILATION
      TESTING:
        text: TESTING
      DOCUMENTATION:
        text: DOCUMENTATION
      BUNDLING:
        text: BUNDLING
      DISTRIBUTION:
        text: DISTRIBUTION
      INSTALLATION:
        text: INSTALLATION
      SYSTEM_CONFIGURATION:
        text: SYSTEM_CONFIGURATION
      OPERATION:
        text: OPERATION
      PATCHING_AND_MAINTENANCE:
        text: PATCHING_AND_MAINTENANCE
      PORTING:
        text: PORTING
      INTEGRATION:
        text: INTEGRATION
      MANUFACTURING:
        text: MANUFACTURING
      DECOMMISSIONING_AND_END_OF_LIFE:
        text: DECOMMISSIONING_AND_END_OF_LIFE
  MitigationStrategy:
    name: MitigationStrategy
    definition_uri: https://w3id.org/lmodel/cwe/MitigationStrategy
    description: General strategy for protecting a system (MitigationStrategyEnumeration
      in XSD).
    from_schema: https://w3id.org/lmodel/cwe
    permissible_values:
      ATTACK_SURFACE_REDUCTION:
        text: ATTACK_SURFACE_REDUCTION
      COMPILATION_OR_BUILD_HARDENING:
        text: COMPILATION_OR_BUILD_HARDENING
      ENFORCEMENT_BY_CONVERSION:
        text: ENFORCEMENT_BY_CONVERSION
      ENVIRONMENT_HARDENING:
        text: ENVIRONMENT_HARDENING
      FIREWALL:
        text: FIREWALL
      INPUT_VALIDATION:
        text: INPUT_VALIDATION
      LANGUAGE_SELECTION:
        text: LANGUAGE_SELECTION
      LIBRARIES_OR_FRAMEWORKS:
        text: LIBRARIES_OR_FRAMEWORKS
      RESOURCE_LIMITATION:
        text: RESOURCE_LIMITATION
      OUTPUT_ENCODING:
        text: OUTPUT_ENCODING
      PARAMETERIZATION:
        text: PARAMETERIZATION
      REFACTORING:
        text: REFACTORING
      SANDBOX_OR_JAIL:
        text: SANDBOX_OR_JAIL
      SEPARATION_OF_PRIVILEGE:
        text: SEPARATION_OF_PRIVILEGE
  DetectionMethodType:
    name: DetectionMethodType
    definition_uri: https://w3id.org/lmodel/cwe/DetectionMethodType
    description: Method that may be employed to detect a weakness (DetectionMethodEnumeration
      in XSD).
    from_schema: https://w3id.org/lmodel/cwe
    permissible_values:
      AUTOMATED_ANALYSIS:
        text: AUTOMATED_ANALYSIS
      AUTOMATED_DYNAMIC_ANALYSIS:
        text: AUTOMATED_DYNAMIC_ANALYSIS
      AUTOMATED_STATIC_ANALYSIS:
        text: AUTOMATED_STATIC_ANALYSIS
      AUTOMATED_STATIC_ANALYSIS_SOURCE_CODE:
        text: AUTOMATED_STATIC_ANALYSIS_SOURCE_CODE
        description: Automated Static Analysis - Source Code
