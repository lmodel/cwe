---
id: https://w3id.org/lmodel/cwe
name: cwe
title: Common Weakness Enumeration (CWE) List and Schema
description: >-
  A LinkML model of the Common Weakness Enumeration, the catalogue of software and
  hardware weakness types that The MITRE Corporation publishes for the CWE Program. It
  renders the catalogue's XML Schema with its own element names and values, so the whole
  catalogue validates with both unchanged.
version: "5.0"
source: https://cwe.mitre.org/data/xsd/cwe_schema_v8.0.xsd
license: Apache-2.0
keywords:
  - weakness
  - CWE
  - root cause mapping
  - software weakness
  - hardware weakness
  - secure coding
see_also:
  - https://lmodel.github.io/cwe
  - https://cwe.mitre.org/
annotations:
  xsd_version: "8.0"
  xsd_namespace: http://cwe.mitre.org/cwe-8
  xsd_date: "2026-10-28"
comments:
  - >-
    The version is the edition of the CWE List that the schema renders, which is the first
    edition under XML Schema 8.0. upstream/ holds both files unchanged,
    tests/test_coverage.py holds the schema to the XSD, and
    scripts/check_upstream_release.py reports when either moves.
  - >-
    The file behind the cwe_schema_latest.xsd link is an earlier copy of 8.0, which the
    catalogue breaks in 69 places. The source above is the file the catalogue itself names,
    and it validates with no error.
prefixes:
  cwe: https://w3id.org/lmodel/cwe/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  skos: http://www.w3.org/2004/02/skos/core#
  wd: http://www.wikidata.org/entity/
default_prefix: cwe
default_range: string

imports:
  - linkml:types
  - ./cwe_core
  - ./cwe_entries

classes:

  CweWeaknessCatalog:
    tree_root: true
    description: One release of the CWE List, with all its entries and the sources they cite.
    comments:
      - >-
        Wikidata's item is the catalogue in general and this class is one release of it, so
        the item is related.
    close_mappings:
      - skos:ConceptScheme
      - schema:DefinedTermSet
    related_mappings:
      - wd:Q2682392
    annotations:
      xsd_type: Weakness_Catalog
    attributes:
      Name:
        description: The name of the catalogue, which is CWE.
        required: true
      Version:
        description: The version of this release.
        required: true
      Date:
        description: The date of this release.
        required: true
        range: date
      Weaknesses:
        description: The weakness entries.
        multivalued: true
        range: CweWeakness
        inlined: true
        inlined_as_list: true
      Groupings:
        description: The grouping entries.
        multivalued: true
        range: CweGrouping
        inlined: true
        inlined_as_list: true
      Views:
        description: The view entries.
        multivalued: true
        range: CweView
        inlined: true
        inlined_as_list: true
      External_References:
        description: The sources that the entries cite.
        multivalued: true
        range: CweExternalReference
        inlined: true
        inlined_as_list: true
