---
id: https://w3id.org/lmodel/cwe/cwe_core
name: cwe_core
title: CWE shared types, value lists and value classes
description: >-
  The value lists of the CWE Schema, with the parts that the catalogue's weaknesses,
  groupings and views share: external references, notes, dimensions, custom phases,
  taxonomy mappings and the content history.
version: "5.0"
source: https://cwe.mitre.org/data/xsd/cwe_schema_v8.0.xsd
license: Apache-2.0
see_also:
  - https://lmodel.github.io/cwe
  - https://cwe.mitre.org/
annotations:
  xsd_version: "8.0"
  xsd_namespace: http://cwe.mitre.org/cwe-8
  xsd_date: "2026-10-28"
notes:
  - >-
    Keys and permissible values keep the XSD's spelling, so the catalogue validates
    with both unchanged. Each class and enum names the XSD type it renders in an
    xsd_type annotation, which tests/test_coverage.py reads.

prefixes:
  capec: https://w3id.org/lmodel/capec/
  cwe: https://w3id.org/lmodel/cwe/
  dcterms: http://purl.org/dc/terms/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  sepses_cwe: http://w3id.org/sepses/vocab/ref/cwe#
  skos: http://www.w3.org/2004/02/skos/core#
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: cwe
default_range: string

imports:
  - linkml:types

types:

  cwe_entry_id:
    typeof: string
    base: str
    uri: xsd:string
    description: The number that identifies an entry of the CWE List, written as text, such as 79.
    comments:
      - >-
        The XSD types it as an integer. It stays a string because LinkML's RDF dumper
        needs an identifier it can expand, and the catalogue's XML holds text anyway.
    pattern: '^[1-9][0-9]*$'
    annotations:
      xsd_type: xs:integer

  cwe_capec_id:
    typeof: string
    base: str
    uri: xsd:string
    description: The number of an attack pattern in the CAPEC list, written as text, such as 63.
    pattern: '^[1-9][0-9]*$'
    annotations:
      xsd_type: xs:integer

  cwe_reference_id:
    typeof: string
    base: str
    uri: xsd:string
    description: The identifier of an external reference in the catalogue, such as REF-1.
    comments:
      - >-
        The XSD types it as a string with no pattern. CWE 5.0 writes REF and a number on all
        but one, whose identifier is the bare number 1300.
    annotations:
      xsd_type: xs:string

  cwe_structured_text:
    typeof: string
    base: str
    uri: xsd:string
    description: >-
      Text that may hold XHTML markup, kept as a well-formed fragment without the namespace
      prefix and with its special characters escaped.
    comments:
      - A consumer that shows this text as HTML must sanitize it first, since it can quote attack strings.
    annotations:
      xsd_type: StructuredTextType

  cwe_publication_year:
    typeof: string
    base: str
    uri: xsd:gYear
    description: A year in XML Schema's form, such as 2021.
    pattern: '^-?[0-9]{4,}(Z|[+-][0-9]{2}:[0-9]{2})?$'
    annotations:
      xsd_type: xs:gYear

  cwe_publication_month:
    typeof: string
    base: str
    uri: xsd:gMonth
    description: A month in XML Schema's form, two hyphens and two digits, such as --03.
    pattern: '^--(0[1-9]|1[0-2])(Z|[+-][0-9]{2}:[0-9]{2})?$'
    annotations:
      xsd_type: xs:gMonth

  cwe_publication_day:
    typeof: string
    base: str
    uri: xsd:gDay
    description: A day of the month in XML Schema's form, three hyphens and two digits, such as ---06.
    pattern: '^---(0[1-9]|[12][0-9]|3[01])(Z|[+-][0-9]{2}:[0-9]{2})?$'
    annotations:
      xsd_type: xs:gDay

enums:

  CweAbstraction:
    description: How far a weakness is described in general terms or tied to a specific product or resource.
    annotations:
      xsd_type: AbstractionEnumeration
    permissible_values:
      Pillar:
        description: The most general level, a theme that the weaknesses under it share.
      Class:
        description: >-
          A very general weakness, usually independent of any language or technology.
      Base:
        description: >-
          A weakness general enough to apply widely and detailed enough to find or
          prevent it.
      Variant:
        description: >-
          A weakness tied to a particular language, technology or kind of product.
      Compound:
        description: >-
          An entry that ties two or more weaknesses together, as a chain or a
          composite.

  CweAlternateTermRole:
    description: The part an alternate term plays when people talk about a weakness.
    annotations:
      xsd_type: AlternateTermRoleEnumeration
    permissible_values:
      Abbreviation:
      Acronym:
      Alternate-Spelling:
      Attack-Focused:
      Impact-Oriented:
      Multi-Weakness:
      Multiple-Interpretation:
      Common-Name:
      Discouraged:
      Legacy:
      Other:

  CweArchitectureClass:
    description: A broad family of hardware architectures.
    annotations:
      xsd_type: ArchitectureClassEnumeration
    permissible_values:
      Embedded:
      Microcomputer:
      Workstation:
      Not Architecture-Specific:
        description: The weakness can appear on many architectures.

  CweArchitectureName:
    description: A named hardware architecture.
    annotations:
      xsd_type: ArchitectureNameEnumeration
    permissible_values:
      Alpha:
      ARM:
      Itanium:
      Power Architecture:
      SPARC:
      x86:
      Other:

  CweDetectionMethodName:
    description: A way of finding a weakness.
    annotations:
      xsd_type: DetectionMethodEnumeration
    permissible_values:
      Automated Analysis:
      Automated Dynamic Analysis:
      Automated Static Analysis:
      Automated Static Analysis - Source Code:
      Automated Static Analysis - Binary or Bytecode:
      Fuzzing:
      Manual Analysis:
      Manual Dynamic Analysis:
      Manual Static Analysis:
      Manual Static Analysis - Source Code:
      Manual Static Analysis - Binary or Bytecode:
      White Box:
      Black Box:
      Architecture or Design Review:
      Dynamic Analysis with Manual Results Interpretation:
      Dynamic Analysis with Automated Results Interpretation:
      Formal Verification:
      Simulation / Emulation:
      Other:

  CweDetectionEffectiveness:
    description: How well a detection method finds a weakness.
    annotations:
      xsd_type: DetectionEffectivenessEnumeration
    permissible_values:
      High:
        description: It finds the weakness often and with few false reports.
      Moderate:
        description: >-
          It works in several situations but misses some forms or gives some false
          reports.
      SOAR Partial:
        description: >-
          The State Of the Art Report rates it as cost-effective for part of the job.
      Opportunistic:
        description: It does not aim at this weakness and finds it only by the way.
      Limited:
        description: It helps only in some situations.
      "None":
        description: It does not find the weakness.

  CweEffectiveness:
    description: How well a mitigation prevents a weakness.
    annotations:
      xsd_type: EffectivenessEnumeration
    permissible_values:
      High:
        description: It often removes the weakness altogether.
      Moderate:
        description: >-
          It prevents several forms of the weakness but does not cover them all.
      Limited:
        description: >-
          It helps only in some situations or against some forms of the weakness.
      Incidental:
        description: It protects by chance and cannot be relied on.
      Discouraged Common Practice:
        description: >-
          A habit people often follow that does not work well enough to recommend.
      Defense in Depth:
        description: >-
          It adds a layer of protection and does not remove the weakness by itself.
      "None":
        description: It does not prevent the weakness.

  CweFunctionalArea:
    description: The part of a product where a weakness is most likely to appear.
    annotations:
      xsd_type: FunctionalAreaEnumeration
    permissible_values:
      Authentication:
      Authorization:
      Code Libraries:
      Counters:
      Cryptography:
      Error Handling:
      Interprocess Communication:
      File Processing:
      Logging:
      Memory Management:
      Networking:
      Number Processing:
      Program Invocation:
      Protection Mechanism:
      Session Management:
      Signals:
      String Processing:
      Not Functional-Area-Specific:
      Power:
      Clock:

  CweImportance:
    description: How much a change to an entry matters to people who already rely on it.
    annotations:
      xsd_type: ImportanceEnumeration
    permissible_values:
      Normal:
      Critical:
        description: The change alters what the entry means or how it may be read.

  CweLanguageClass:
    description: A broad family of programming languages.
    annotations:
      xsd_type: LanguageClassEnumeration
    permissible_values:
      Assembly:
      Compiled:
      Hardware Description Language:
      Interpreted:
      Object-Oriented:
      Memory-Unsafe:
      Not Language-Specific:
        description: The weakness can appear in many languages.

  CweLanguageName:
