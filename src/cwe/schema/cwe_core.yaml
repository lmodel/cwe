  CweObservedExampleRationale:
    description: A hint at why an observed example was chosen for an entry.
    annotations:
      xsd_type: ObexRationaleEnumeration
    permissible_values:
      Chain:
      Early-Publication:
        description: One of the earliest examples recognised as showing this weakness.
      Influential/Newsworthy:
        description: >-
          An example that drew attention or shaped how people see this weakness.
      Language-Variety:
      Product-Variety:
      Attack-Surface:
      Other:

  CweReferenceAccessRestriction:
    description: What stands between a reader and a cited source.
    annotations:
      xsd_type: ReferenceAccessRestrictionsEnumeration
    permissible_values:
      "None":
        description: Anybody on the internet can read it for free.
      Proprietary-Subscription:
        description: Only paying subscribers can read it.
      Minimal-Registration:
        description: A reader must register, at no cost, to read it.
      Removed:
        description: It has been taken down and may have no other copy.
      Other:

  CweReferenceMediaType:
    description: The form a cited source takes, which affects how easily people can use it.
    annotations:
      xsd_type: ReferenceMediaTypeEnumeration
    permissible_values:
      Text:
        description: >-
          Plain text or a format that is easy to parse, as HTML with no scripts is.
      Common-Proprietary-Text:
        description: >-
          A widely used proprietary format for text, such as PDF or a word processor
          file.
      Video:
        description: A recording with pictures, such as a conference talk.
      Audio:
        description: A recording with sound and no pictures.
      Other:
        description: Some other format, which may be harder for some readers to use.

  CweReferenceRationale:
    description: A hint at why a source was cited.
    annotations:
      xsd_type: ReferenceRationaleEnumeration
    permissible_values:
      Example:
        description: >-
          It gives more detail on an example in the entry, and may be where the example
          came from.
      Early-Publication:
        description: >-
          One of the first publications to explain the weakness or how it is exploited.
      Influential/Newsworthy:
        description: >-
          A publication that drew attention or shaped how people see the weakness.
      Manual/Man Pages:
        description: >-
          Technical reference material that gives background and is not about the
          weakness itself.
      Mitigation-Based:
        description: >-
          It proposes ways to reduce or remove weaknesses across a whole system.
      Secure-Development-Rules:
        description: It points to formal rules or guides for developing securely.
      Other:

  CweContributionType:
    description: What a contribution to an entry consisted of.
    annotations:
      xsd_type: ContentHistoryType/Contribution/@Type
    permissible_values:
      Content:
        description: Content given to the entry.
      Feedback:
        description: Feedback on the entry.

classes:

  CweExternalReference:
    description: A source that entries of the catalogue cite, such as a paper, a book or a web page.
    close_mappings:
      - sepses_cwe:Reference
      - capec:CapecExternalReference
    annotations:
      xsd_type: ExternalReferenceType
    attributes:
      Reference_ID:
        description: The identifier entries use to cite this source.
        identifier: true
        range: cwe_reference_id
      Author:
        description: A person or group who wrote the source.
        multivalued: true
        exact_mappings:
          - sepses_cwe:referenceAuthor
        close_mappings:
          - dcterms:creator
      Title:
        description: The title of the source.
        required: true
        exact_mappings:
          - sepses_cwe:referenceTitle
          - dcterms:title
      Edition:
        description: The edition of the source.
        exact_mappings:
          - sepses_cwe:referenceEdition
        close_mappings:
          - schema:bookEdition
      Publication:
        description: The journal, conference or other publication that holds the source.
      Publication_Year:
        description: The year the source came out.
        range: cwe_publication_year
        exact_mappings:
          - sepses_cwe:referencePublicationYear
      Publication_Month:
        description: The month the source came out.
        range: cwe_publication_month
        exact_mappings:
          - sepses_cwe:referencePublicationMonth
      Publication_Day:
        description: The day of the month the source came out.
        range: cwe_publication_day
        exact_mappings:
          - sepses_cwe:referencePublicationDay
      Publisher:
        description: Who published the source.
        exact_mappings:
          - sepses_cwe:referencePublisher
        close_mappings:
          - dcterms:publisher
      URL:
        description: An address where the source can be read.
        range: uri
        comments:
          - One entry of CWE 5.0, REF-1068, holds the word Original here, which the XSD's anyURI admits.
        exact_mappings:
          - sepses_cwe:referenceUrl
        close_mappings:
          - schema:url
      URL_Date:
        description: The date on which the address was last seen to work.
        range: date
      Alt_URL:
        description: Another address of the source, usually one with fewer restrictions.
        range: uri
      Alt_URL_Date:
        description: The date on which the other address was last seen to work.
        range: date
      Media_Type:
        description: A form the source takes.
        range: CweReferenceMediaType
        multivalued: true
      Access_Restrictions:
        description: What stands between a reader and the source.
        range: CweReferenceAccessRestriction
      Rationale:
        description: A hint at why the source was cited.
        range: CweReferenceRationale
        multivalued: true

  CweReference:
    description: A citation of an external reference from an entry or from one of its parts.
    annotations:
      xsd_type: ReferencesType/Reference
    attributes:
      External_Reference_ID:
        description: The external reference being cited.
        required: true
        range: CweExternalReference
      Section:
        description: The section or page of the source that this citation means.

  CweDimension:
    description: One aspect of a weakness, or of how two weaknesses differ, named in a word or two.
    annotations:
      xsd_type: DimensionElementType
    attributes:
      Type:
        description: The kind of aspect, such as a behaviour or a resource.
        required: true
        range: CweDimensionType
      Value:
        description: The aspect itself, such as Generation or Page.
        required: true
        annotations:
          xsd_text_of: xs:string

  CweCustomPhase:
    description: A life cycle stage from a field whose stages differ from those of software.
    comments:
      - >-
        XML Schema cannot tie the value to the domain, as a comment in the XSD regrets, so
        the XSD takes either list under either domain. The rules below state what it means,
        and tests/test_schema_rules.py holds their lists to the two enums.
    annotations:
      xsd_type: CustomPhaseType
    attributes:
      Domain:
        description: The field whose life cycle the stage belongs to.
        required: true
        range: CweCustomPhaseDomain
      Value:
        description: The stage.
        required: true
        any_of:
          - range: CweAiPhase
          - range: CweHardwarePhase
        annotations:
          xsd_text_of: CustomPhaseEnumeration
    rules:
      - description: A stage in the AI domain comes from the AI list.
        preconditions:
          slot_conditions:
            Domain:
              equals_string: AI
        postconditions:
          slot_conditions:
            Value:
              equals_string_in:
                - Data Collection
                - Training
                - Fine-tuning
                - Testing
                - Tokenization
                - Prompting
                - Output Processing
                - Component Interaction
                - Re-training / Feedback
      - description: A stage in the Hardware domain comes from the hardware list.
        preconditions:
          slot_conditions:
            Domain:
              equals_string: Hardware
        postconditions:
          slot_conditions:
            Value:
              equals_string_in:
                - Hardware Requirements
                - Hardware Architecture
                - Hardware Microarchitecture
                - Implementation & Physical Design
                - Pre-Manufacturing Verification
                - Hardware Manufacturing
                - Post-Manufacturing Validation
                - 'Device Configuration & Personalization'
                - Device / System Integration
                - 'Field Operations & Sustainment'
                - Reuse
                - Decommissioning

  CweNote:
    description: A remark on an entry that fits nowhere else.
    annotations:
      xsd_type: NotesType/Note
    attributes:
      Type:
        description: What the note is about.
        required: true
        range: CweNoteType
      Version:
        description: The CWE version the note belongs to.
      ReleaseDate:
        description: The release date of that version.
        range: date
      Value:
        description: The text of the note.
        range: cwe_structured_text
        annotations:
          xsd_text_of: StructuredTextType

  CweTaxonomyMapping:
    description: A link from an entry to an entry of another taxonomy.
    annotations:
      xsd_type: TaxonomyMappingsType/Taxonomy_Mapping
    attributes:
      Taxonomy_Name:
        description: The other taxonomy.
        required: true
        range: CweTaxonomyName
      Entry_ID:
        description: The identifier of the entry in the other taxonomy.
      Entry_Name:
        description: The name of the entry in the other taxonomy.
      Mapping_Fit:
        description: How closely the two entries match.
        range: CweMappingFit

  CweContentHistory:
    description: The record of who wrote an entry and how it has changed since.
    annotations:
      xsd_type: ContentHistoryType
    attributes:
      Submission:
        description: The original submission of the entry, or each of several.
        required: true
        multivalued: true
        range: CweSubmission
        inlined: true
        inlined_as_list: true
        close_mappings:
          - sepses_cwe:hasSubmissionHistory
      Modification:
        description: A change made to the entry.
        multivalued: true
        range: CweModification
        inlined: true
        inlined_as_list: true
        close_mappings:
          - sepses_cwe:hasModificationHistory
          - skos:changeNote
      Contribution:
        description: Feedback or content that someone gave to the entry.
        multivalued: true
        range: CweContribution
        inlined: true
        inlined_as_list: true
      Previous_Entry_Name:
        description: A name the entry used to have.
        multivalued: true
        range: CwePreviousEntryName
        inlined: true
        inlined_as_list: true

  CweSubmission:
    description: Who first submitted an entry, and when it joined the list.
    close_mappings:
      - sepses_cwe:SubmissionHistory
    annotations:
      xsd_type: ContentHistoryType/Submission
    any_of:
      - slot_conditions:
          Submission_Name:
            required: true
      - slot_conditions:
          Submission_Organization:
            required: true
    attributes:
      Submission_Name:
        description: A person or group who submitted the entry.
        multivalued: true
        exact_mappings:
          - sepses_cwe:submissionName
      Submission_Organization:
        description: The organization the submitter belongs to.
        exact_mappings:
          - sepses_cwe:submissionOrganization
      Submission_Date:
        description: The date of the submission.
        required: true
        range: date
        exact_mappings:
          - sepses_cwe:submissionDate
      Submission_Version:
        description: The first CWE version that held the submission.
        required: true
      Submission_ReleaseDate:
        description: The release date of that version.
        required: true
        range: date
      Submission_Comment:
        description: A remark on the submission.

  CweModification:
    description: One change made to an entry.
    close_mappings:
      - sepses_cwe:ModificationHistory
    annotations:
      xsd_type: ContentHistoryType/Modification
    attributes:
      Modification_Name:
        description: The person who made or suggested the change.
        exact_mappings:
          - sepses_cwe:modificationName
      Modification_Organization:
        description: The organization that person belongs to.
        exact_mappings:
          - sepses_cwe:modificationOrganization
      Modification_Date:
        description: The date of the change.
        required: true
        range: date
        exact_mappings:
          - sepses_cwe:modificationDate
      Modification_Version:
        description: The first CWE version that held the change.
        required: true
      Modification_ReleaseDate:
        description: The release date of that version.
        required: true
        range: date
      Modification_Importance:
        description: How much the change matters to people who rely on the entry.
        range: CweImportance
      Modification_Comment:
        description: What changed.
        required: true
        exact_mappings:
          - sepses_cwe:modificationComment

  CweContribution:
    description: Feedback or content that someone gave to an entry.
    annotations:
      xsd_type: ContentHistoryType/Contribution
    attributes:
      Type:
        description: Whether the contribution was feedback or content.
        required: true
        range: CweContributionType
      Contribution_Name:
        description: A person or group who contributed.
        multivalued: true
      Contribution_Organization:
        description: The organization the contributor belongs to.
      Contribution_Date:
        description: The date of the contribution.
        required: true
        range: date
      Contribution_Version:
        description: The first CWE version that held the contribution.
        required: true
      Contribution_ReleaseDate:
        description: The release date of that version.
        required: true
        range: date
      Contribution_Comment:
        description: A remark on the contribution.

  CwePreviousEntryName:
    description: A name an entry had before.
    annotations:
      xsd_type: ContentHistoryType/Previous_Entry_Name
    attributes:
      Date:
        description: The date the name stopped being used.
        required: true
        range: date
      Version:
        description: The CWE version in which the name changed.
      Value:
        description: The earlier name.
        required: true
        annotations:
          xsd_text_of: xs:string
