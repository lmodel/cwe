      Microcontroller Hardware:
      Network on Chip Hardware:
      Power Management Hardware:
      Processor Hardware:
      Security Hardware:
      Sensor Hardware:
      Storage Hardware:
      Test/Debug Hardware:
      Other:

  CweUsage:
    description: Whether an entry may be used when mapping a real vulnerability to its root cause.
    annotations:
      xsd_type: UsageEnumeration
    permissible_values:
      Discouraged:
        description: It should not be used for mapping.
      Prohibited:
        description: It must not be used for mapping.
      Allowed:
        description: It may be used for mapping.
      Allowed-with-Review:
        description: >-
          It may be used for mapping only in limited situations and after careful
          review.

  CweViewType:
    description: How a view selects and arranges its entries.
    annotations:
      xsd_type: ViewTypeEnumeration
    permissible_values:
      Implicit:
        description: A flat list that a filter selects.
      Explicit:
        description: A flat list whose members are named one by one.
      Graph:
