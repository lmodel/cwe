    annotations:
      xsd_type: LanguageNameEnumeration
    permissible_values:
      Ada:
      Algorithm:
      ARM Assembly:
      ASP:
      ASP.NET:
      Basic:
      C:
      C++:
        title: C plus plus
      "C#":
        title: C sharp
      COBOL:
      Fortran:
      "F#":
        title: F sharp
      Go:
      HTML:
      Java:
      JavaScript:
      JSON:
      JSP:
      Objective-C:
      Pascal:
      Perl:
      PHP:
      Pseudocode:
      Python:
      Ruby:
      Rust:
      Shell:
      SQL:
      Swift:
      SystemVerilog:
      VB.NET:
      Verilog:
      VHDL:
      XML:
      x86 Assembly:
      Other:

  CweLikelihood:
    description: How likely something is to happen.
    annotations:
      xsd_type: LikelihoodEnumeration
    permissible_values:
      High:
      Medium:
      Low:
      Unknown:
        description: Nobody knows how likely it is.

  CweMitigationStrategy:
    description: A general approach that a mitigation follows.
    annotations:
      xsd_type: MitigationStrategyEnumeration
    permissible_values:
      Attack Surface Reduction:
      Compilation or Build Hardening:
      Enforcement by Conversion:
      Environment Hardening:
      Firewall:
      Input Validation:
      Language Selection:
      Libraries or Frameworks:
      Resource Limitation:
      Output Encoding:
      Parameterization:
      Refactoring:
      Sandbox or Jail:
      Separation of Privilege:

  CweNoteType:
    description: What a note on an entry is about.
    annotations:
      xsd_type: NoteTypeEnumeration
    permissible_values:
      Applicable Platform:
        description: More detail on the platforms the entry lists.
      Maintenance:
        description: >-
          Work the entry still needs, such as sharper concepts or better relationships.
      Relationship:
        description: More detail on how the entry relates to others.
      Research Gap:
        description: A topic researchers have not yet explored enough.
      Terminology:
        description: A discussion of the words used for the weakness.
      Theoretical:
        description: The weakness described in the terms of vulnerability theory.
      Other:
        description: Anything useful that fits no other type.

  CweOrdinal:
    description: Marks the relationship to prefer among several in one view.
    annotations:
      xsd_type: OrdinalEnumeration
    permissible_values:
      Primary:
        description: The relationship to follow first in that view.

  CweOrdinality:
    description: How a weakness stands to other weaknesses in a sequence of causes.
    annotations:
      xsd_type: OrdinalityEnumeration
    permissible_values:
      Indirect:
        description: >-
          A quality problem that makes other weaknesses easier to introduce or harder
          to find.
      Primary:
        description: The weakness exists without depending on another one.
      Resultant:
        description: The weakness exists only because another one is present.

  CweOperatingSystemClass:
    description: A broad family of operating systems.
    annotations:
      xsd_type: OperatingSystemClassEnumeration
    permissible_values:
      Linux:
      macOS:
      Unix:
      Windows:
      Not OS-Specific:
        description: The weakness can appear on many operating systems.

  CweOperatingSystemName:
    description: A named operating system.
    annotations:
      xsd_type: OperatingSystemNameEnumeration
    permissible_values:
      AIX:
      Android:
      BlackBerry OS:
      Chrome OS:
      Darwin:
      FreeBSD:
      iOS:
      macOS:
      NetBSD:
      OpenBSD:
      Red Hat:
      Solaris:
      SUSE:
      tvOS:
      Ubuntu:
      watchOS:
      Windows 9x:
      Windows Embedded:
      Windows NT:
      Other:

  CwePhase:
    description: A stage of a product life cycle.
    annotations:
      xsd_type: PhaseEnumeration
    permissible_values:
      Policy:
      Requirements:
      Architecture and Design:
      Implementation:
      Build and Compilation:
      Testing:
      Documentation:
      Bundling:
      Distribution:
      Installation:
      System Configuration:
      Operation:
      Patching and Maintenance:
      Porting:
      Integration:
      Manufacturing:
      Decommissioning and End-of-Life:

  CweAiPhase:
    description: A stage of the life cycle of an artificial intelligence system.
    annotations:
      xsd_type: AIPhaseEnumeration
    permissible_values:
      Data Collection:
      Training:
      Fine-tuning:
      Testing:
      Tokenization:
      Prompting:
      Output Processing:
      Component Interaction:
      Re-training / Feedback:

  CweHardwarePhase:
    description: A stage of the life cycle of a hardware product.
    annotations:
      xsd_type: HardwarePhaseEnumeration
    permissible_values:
      Hardware Requirements:
      Hardware Architecture:
      Hardware Microarchitecture:
      "Implementation & Physical Design":
      Pre-Manufacturing Verification:
      Hardware Manufacturing:
      Post-Manufacturing Validation:
      "Device Configuration & Personalization":
      Device / System Integration:
      "Field Operations & Sustainment":
      Reuse:
      Decommissioning:

  CweCustomPhaseDomain:
    description: The field whose own life cycle a custom phase belongs to.
    annotations:
      xsd_type: CustomPhaseDomainEnumeration
    permissible_values:
      AI:
      Hardware:

  CweDimensionType:
    description: The aspect of a weakness that a dimension names, such as a behaviour or a resource.
    annotations:
      xsd_type: DimensionEnumeration
    permissible_values:
      Behavior-Type:
      Behavior-Property:
      Resource-Type:
      Resource-Property:
      Input-Type:
      Input-Property:
      Info-Type:
      Info-Property:
      Code-Type:
      Code-Property:
      Technology:
      Language-Type:
      Language-Property:
      Framework:
      Common-Name:
      Attack:
      Acronym:
      Other:

  CwePrevalence:
    description: How regularly a weakness applies to a platform.
    annotations:
      xsd_type: PrevalenceEnumeration
    permissible_values:
      Often:
      Sometimes:
      Rarely:
      Undetermined:
      "None":

  CweReason:
    description: A short label for why an entry may not suit vulnerability mapping.
    comments:
      - >-
        Category stays beside Grouping because XSD 8.0 lists both. The data of CWE 5.0
        uses only Grouping.
    annotations:
      xsd_type: ReasonEnumeration
    permissible_values:
      Abstraction:
      Category:
      Grouping:
      View:
      Deprecated:
      Potential Deprecation:
      Frequent Misuse:
      Frequent Misinterpretation:
      Multiple Use:
      CWE Overlap:
      Acceptable-Use:
      Frequently-Resultant:
      Potential Major Changes:
      Other:

  CweRelatedNature:
    description: How one weakness relates to another.
    comments:
      - >-
        ChildOf and ParentOf are inverses, as are CanPrecede and CanFollow, and
        Requires and RequiredBy. PeerOf and Overlaps read the same in both directions,
        as the CWE news article of 2026-10-28 says. The XSD says CanAlsoBe need not be
        reciprocal.
    annotations:
      xsd_type: RelatedNatureEnumeration
    permissible_values:
      ChildOf:
        description: The related weakness is more general than this one.
        close_mappings:
          - skos:broader
      ParentOf:
        description: The related weakness is more specific than this one.
        close_mappings:
          - skos:narrower
      StartsWith:
        description: >-
          For a named chain only: the related weakness is where the chain begins.
      CanFollow:
        description: In a chain, the related weakness can come before this one.
      CanPrecede:
        description: In a chain, the related weakness can come after this one.
      RequiredBy:
        description: >-
          For composites only: the related composite needs this weakness to be present.
      Requires:
        description: >-
          For composites only: this composite needs the related weakness to be present.
      CanAlsoBe:
        description: >-
          In some settings this weakness may be seen as the related one, with neither
          being a parent of the other.
      PeerOf:
        description: The two are similar in a way that no other nature fits.
        related_mappings:
          - skos:related
      Overlaps:
        description: The two weaknesses share some ground, which CWE would rather avoid.

  CweResource:
    description: A kind of system resource that exploiting a weakness can affect.
    annotations:
      xsd_type: ResourceEnumeration
    permissible_values:
      CPU:
      File or Directory:
      Memory:
      System Process:
      Other:

  CweScope:
    description: The security property a consequence violates.
    annotations:
      xsd_type: ScopeEnumeration
    permissible_values:
      Confidentiality:
      Integrity:
      Availability:
      Access Control:
      Accountability:
      Authentication:
      Authorization:
      Non-Repudiation:
      Other:

  CweStatus:
    description: How far an entry has come in its life and how much it can be trusted.
    annotations:
      xsd_type: StatusEnumeration
    permissible_values:
      Deprecated:
        description: >-
          Taken out of CWE, usually because it duplicated another entry or was made by
          mistake.
      Draft:
        description: >-
          Its important elements are filled in and readable, though it may still have
          problems.
      Incomplete:
        description: Some important elements are missing and its quality is not assured.
      Obsolete:
        description: >-
          Still correct but no longer relevant, usually because a newer entry replaced
          it.
      Stable:
        description: >-
          Its important elements have been checked and are not expected to change much.
      Usable:
        description: >-
          It has had close review and its critical elements have been checked.

  CweStakeholderType:
    description: A group of people who may have a use for a view.
    annotations:
      xsd_type: StakeholderEnumeration
    permissible_values:
      Academic Researchers:
      Applied Researchers:
      Assessment Teams:
      Assessment Tool Vendors:
      CWE Team:
      Educators:
      Hardware Designers:
      Information Providers:
      Product Customers:
      Product Vendors:
      Software Developers:
      Vulnerability Analysts:
      Other:

  CweStructure:
    description: Whether a weakness stands alone or is made up of others.
    annotations:
      xsd_type: StructureEnumeration
    permissible_values:
      Chain:
        description: >-
          Several weaknesses that must be reached one after another to give a
          vulnerability.
      Composite:
        description: >-
          Several weaknesses that give a vulnerability only when they occur together.
      Simple:
        description: One weakness whose exploitation does not depend on another.

  CweCodeNature:
    description: What a block of example code shows.
    annotations:
      xsd_type: StructuredCodeNatureEnumeration
    permissible_values:
      Attack:
        description: An attack against the code.
      Bad:
        description: Code that has the weakness.
      Good:
        description: Code that avoids the weakness.
      Informative:
        description: Background that shows neither good nor bad code.
      Mitigation:
        description: A way of addressing the weakness.
      Result:
        description: What running the code produces.

  CweMappingFit:
    description: How closely a CWE entry matches an entry of another taxonomy.
    annotations:
      xsd_type: TaxonomyMappingFitEnumeration
    permissible_values:
      Exact:
      CWE More Abstract:
        description: The CWE entry is more general than the other.
      CWE More Specific:
        description: The CWE entry is narrower than the other.
      Imprecise:
        description: The two match only loosely.
      Perspective:
        description: The two look at the same matter from different angles.

  CweTaxonomyName:
    description: A taxonomy that CWE entries are mapped to.
    annotations:
      xsd_type: TaxonomyNameEnumeration
    permissible_values:
      "7 Pernicious Kingdoms":
        title: Seven Pernicious Kingdoms
      "19 Deadly Sins":
        title: Nineteen Deadly Sins
      Aslam:
      Bishop:
      CERT C Secure Coding:
      CERT C++ Secure Coding:
      The CERT Oracle Secure Coding Standard for Java (2011):
      CLASP:
      ISA/IEC 62443:
      Landwehr:
      OMG ASCSM:
      OMG ASCRM:
      OMG ASCMM:
      OMG ASCPEM:
      OpenSSF Secure Coding Guide for Python:
      OWASP Golang Secure Coding Practices Guide:
      OWASP Top Ten 2004:
      OWASP Top Ten 2007:
      OWASP Top Ten:
      PLC Top 20:
      PLOVER:
      Protection Analysis:
      RISOS:
      SEI CERT C Coding Standard:
      SEI CERT C++ Coding Standard:
      SEI CERT Oracle Coding Standard for Java:
      SEI CERT Perl Coding Standard:
      Software Fault Patterns:
      "Weber, Karger, Paradkar":
      WASC:

  CweTechnicalImpact:
