  CweTechnologyName:
    description: A named technology.
    annotations:
      xsd_type: TechnologyNameEnumeration
    permissible_values:
      AI/ML:
      Web Server:
      Database Server:
      Accelerator Hardware:
      Analog and Mixed Signal Hardware:
      Audio/Video Hardware:
      Bus/Interface Hardware:
      Clock/Counter Hardware:
      Communication Hardware:
      Controller Hardware:
