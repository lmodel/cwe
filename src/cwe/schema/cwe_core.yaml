      "DoS: Amplification":
      "DoS: Instability":
      "DoS: Prevent Access":
      "DoS: Resource Consumption (CPU)":
      "DoS: Resource Consumption (Memory)":
      "DoS: Resource Consumption (Other)":
      "DoS: Other":
      Execute Unauthorized Code or Commands:
      Gain Privileges or Assume Identity:
      Bypass Protection Mechanism:
      Hide Activities:
      Alter Execution Logic:
      Undefined Behavior:
      Quality Degradation:
      Unexpected State:
      Varies by Context:
      Increase Analytical Complexity:
      Reduce Maintainability:
      Reduce Performance:
      Reduce Reliability:
      Other:

  CweTechnologyClass:
    description: A broad family of technologies.
    annotations:
      xsd_type: TechnologyClassEnumeration
    permissible_values:
      Client Server:
      Cloud Computing:
      ICS/OT:
      Mainframe:
      Mobile:
      N-Tier:
      SOA:
      System on Chip:
      Web Based:
      Not Technology-Specific:
