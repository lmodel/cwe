# LinkML linter configuration for cwe
# standard_naming is disabled for permissible values because CWE defines
# controlled vocabulary strings that must be preserved verbatim for fidelity
# to the upstream standard (e.g., "Automated Static Analysis - Source Code",
# "C++", "7 Pernicious Kingdoms", "ISA/IEC 62443").
rules:
  recommended:
    level: warning
  no_xsd_int_type:
    level: error
  no_invalid_slot_usage:
    level: error
  no_undeclared_slots:
    level: error
  no_undeclared_ranges:
    level: error
  one_identifier_per_class:
    level: error
  one_key_per_class:
    level: error
  root_type_checks:
    level: error
  standard_naming:
    level: disabled
  canonical_prefixes:
    level: warning
